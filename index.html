<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer_Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================== CSS ธีม Dark Mode + Neon ================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #00F0FF; /* สีนีออนฟ้า */
  --secondary: #FF007A; /* สีนีออนชมพู */
  --bg-main: #0B0C10; /* พื้นหลังสีดำเข้ม */
  --bg-card: #151722; /* สีพื้นหลังการ์ด */
  --border-gold: #D4AF37; /* สีทอง */
  --text-muted: #8A92B2;
  --text-dark: #FFFFFF;
}
body {
  font-family: 'Kanit', sans-serif;
  background-color: var(--bg-main);
  background-image: radial-gradient(circle at 50% 10%, #2b1738 0%, var(--bg-main) 60%);
  color: #fff;
  overflow-x: hidden; padding-bottom: 110px;
  min-height: 100vh;
}

#pts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

/* ป้ายสถานะร้าน */
.shop-status {
  position: absolute; top: 15px; right: 15px;
  padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 6px; z-index: 100;
  border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1.5s infinite; background: #fff; }
.status-open { border-color: #00d300; color: #00d300; }
.status-open .status-dot { background: #00d300; }
.status-closed { border-color: #ff3b3b; color: #ff3b3b; }
.status-closed .status-dot { background: #ff3b3b; }
@keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.5); opacity: 1; } }

/* เฮดเดอร์ กรอบทอง */
.hero {
  position: relative;
  background: linear-gradient(180deg, #1A1A24 0%, #0F1016 100%);
  border: 2px solid var(--border-gold);
  outline: 1px solid var(--border-gold);
  outline-offset: -6px;
  border-radius: 20px;
  margin: 30px 15px 20px;
  padding: 25px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(212, 175, 55, 0.15);
  display: flex; align-items: center; gap: 15px;
  z-index: 10;
}
.hero-logo {
  width: 65px; height: 65px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--border-gold);
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
  background: #222;
}
.hero-text { flex: 1; text-align: left; }
.hero-title { font-family: 'Mitr', sans-serif; font-size: 22px; font-weight: 700; color: var(--border-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5); cursor: pointer; }
.hero-sub { font-size: 13px; color: #ccc; margin-top: 2px; }

/* โซนหมวดหมู่และแท็บ */
.category-header {
  padding: 0 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
}
.category-title { font-size: 16px; font-weight: 600; color: #fff; }

.tab-scroll-container {
  width: 100%; overflow-x: auto; white-space: nowrap;
  padding: 5px 20px 15px; display: flex; gap: 10px;
  scrollbar-width: none;
}
.tab-scroll-container::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 8px 18px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); 
  font-size: 13px; font-weight: 500; font-family: 'Kanit';
  cursor: pointer; background: rgba(255,255,255,0.05); color: var(--text-muted); transition: 0.3s;
}
.tab-btn.active { 
  background: linear-gradient(90deg, #ff007a, #9d00ff); 
  color: #fff; 
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(255, 0, 122, 0.4); 
}

/* พื้นที่จัดเรียงสินค้า */
.content { max-width: 800px; margin: 0 auto; padding: 0 20px 50px; }
.filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.sort-select { background: #1A1A24; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 8px; font-family: 'Kanit'; font-size: 12px; outline: none; }

.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
.item-card {
  background: var(--bg-card); border-radius: 16px; padding: 15px; position: relative;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center;
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.2s; min-height: 175px; 
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.item-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }

/* การ์ดที่ถูกเลือก เรืองแสงฟ้านีออน */
.item-card.selected { 
  border-color: var(--primary); 
  background: rgba(0, 240, 255, 0.05);
  transform: translateY(-3px); 
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1); 
}

.card-icon { width: 65px; height: 65px; border-radius: 14px; object-fit: cover; margin-bottom: 12px; background: #222; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
.card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-bottom: 4px; color: #fff; }
.card-desc { font-size: 11px; color: var(--text-muted); flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; width: 100%; }
.card-price { color: #fff; font-weight: 500; font-size: 13px; margin-top: 8px; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 12px; }
.item-card.selected .card-price { background: var(--primary); color: #000; font-weight: 700; box-shadow: 0 0 10px var(--primary); }

.check-circle { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.5); z-index: 2; transition: 0.2s; }
.item-card.selected .check-circle { background: var(--primary); border-color: var(--primary); }
.item-card.selected .check-circle::after { content: '✓'; color: #000; font-size: 12px; font-weight: bold; }

.app-status { position: absolute; top: 10px; right: 10px; font-size: 9px; font-weight: 600; padding: 3px 6px; border-radius: 6px; color: #fff; z-index: 2; }
.status-ready { background: #00d300; }
.status-notready { background: #ff3b3b; }

.os-btn {
  background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); 
  padding: 4px 8px; border-radius: 8px; font-size: 10px; cursor: pointer;
  font-family: 'Kanit'; transition: 0.2s; flex: 1; text-align: center; margin-top: 5px;
}
.item-card.selected .os-btn.active { background: var(--primary); color: #000; font-weight: 700; border-color: var(--primary); box-shadow: 0 0 8px var(--primary); }

.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 16, 22, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid rgba(255,255,255,0.1); padding: 15px 24px; display: flex; justify-content: space-between; align-items: center;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
}
.bottom-bar.active { transform: translateY(0); }
.bb-btn { background: linear-gradient(90deg, #ff007a, #9d00ff); color: #fff; border: none; border-radius: 25px; padding: 12px 24px; font-weight: 600; font-family: 'Kanit'; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 0, 122, 0.4); transition: 0.2s; }
.bb-btn:hover { filter: brightness(1.2); }

#admin-badge {
  position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; background: #fff; border-radius: 50%;
  display: none; justify-content: center; align-items: center; color: #000; font-size: 24px; font-weight: bold;
  box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3); z-index: 999; cursor: pointer;
}

/* Modal Admin (ให้สว่างหน่อยจะได้อ่านง่าย) */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; }
.loader { border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.admin-modal { background: #1A1A24; color: #fff; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
.close-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 22px; font-weight: bold; color: #ff3b3b; }
.admin-form input, .admin-form select, .admin-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #252836; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: 'Kanit'; }
.admin-btn { padding: 10px 15px; background: #3B96F5; color: #fff; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-family: 'Kanit'; font-weight: 600; }
.group-header { grid-column: 1 / -1; margin-top: 10px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; color: var(--primary); font-size: 15px; }
.back-btn { display: inline-block; background: rgba(255,255,255,0.1); padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div id="pts"></div>

<div class="hero">
  <div class="shop-status status-open" id="shopStatusPill">
    <div class="status-dot"></div>
    <span id="shopStatusText">OPEN</span>
  </div>

  <img src="https://via.placeholder.com/100" id="shopLogo" class="hero-logo" alt="Logo">
  <div class="hero-text">
    <div class="hero-title" onclick="adminLoginClick()">Wanderer_Shop</div>
    <div class="hero-sub" id="welcomeText">Line ID: @Wanderer_Shop</div>
  </div>
</div>

<div class="category-header">
  <div class="category-title">หมวดหมู่สินค้า</div>
</div>
<div class="tab-scroll-container" id="tabContainer">
  </div>

<div class="content">
  <div class="filter-row">
    <span style="font-size: 14px; color: var(--text-muted);" id="currentTabTitle">กำลังโหลด...</span>
    <select class="sort-select" id="sortSelect" onchange="renderProducts()">
      <option value="name">เรียงตามอักษร</option>
      <option value="price">เรียงตามราคา</option>
    </select>
  </div>
  
  <div class="grid-container" id="productGrid"></div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div>
    <div style="font-size: 12px; color: #ccc;">เลือก <span id="cartCount">0</span> รายการ</div>
    <div style="font-size: 20px; font-weight: 700; color: var(--primary);"><span id="cartTotal">0</span> บาท</div>
  </div>
  <button class="bb-btn" onclick="checkout()">สั่งซื้อสินค้า</button>
</div>

<div id="admin-badge" onclick="openAdmin()">+</div>
<div class="overlay" id="loadingOverlay"><div class="loader"></div></div>

<div class="overlay" id="adminOverlay">
  <div class="admin-modal">
    <span class="close-btn" onclick="closeAdmin()">×</span>
    <h2 style="margin-bottom: 15px; color: var(--primary);">จัดการระบบ (Admin)</h2>
    
    <div class="admin-form">
      <input type="hidden" id="a_id"> 
      <label style="font-size: 13px; color: #ccc; font-weight: bold;">เลือกหมวดหมู่ที่ต้องการจัดการ:</label>
      <select id="a_tab" onchange="toggleAdminFields()" style="background:#000; border-color:var(--primary); font-weight:bold;">
        <option value="STORE_INFO">⚙️ ข้อมูลร้านค้า</option>
        <option value="แอพพรีเมี่ยม">📦 สินค้า: แอพพรีเมี่ยม</option>
        <option value="เติมเกม">🎮 สินค้า: เติมเกม</option>
        <option value="IOS-ANDROID">📱 สินค้า: IOS-ANDROID</option>
        <option value="MANAGE_TABS">📁 จัดการแท็บ (เพิ่มแท็บใหม่)</option>
      </select>
      
      <div id="zone-premium-game" style="display: none; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.3);">
        <input type="text" id="pg_cat" placeholder="ชื่อแอป / หมวดหมู่หลัก (เช่น Netflix)">
        <input type="text" id="pg_appDesc" placeholder="รายละเอียดใต้ชื่อแอป (เช่น ดูหนัง 4K)">
        <input type="text" id="pg_subCat" placeholder="ตัวเลือกแพ็กเกจ [จัดกลุ่ม] (เช่น 7วัน)">
        <input type="text" id="pg_name" placeholder="ชื่อแพ็กเกจย่อย (เช่น มือถือ/ไอแพด)">
        <input type="text" id="pg_desc" placeholder="รายละเอียดย่อย (เว้นว่างได้)">
        <input type="number" id="pg_price" placeholder="ราคา (บาท)">
        <input type="text" id="pg_icon" placeholder="ลิงก์รูปภาพแอป/ไอคอน (URL)">
      </div>

      <div id="zone-ios-android" style="display: none; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.3);">
        <input type="text" id="ia_cat" placeholder="ชื่อแอป / หมวดหมู่ (เช่น Minecraft)">
        <input type="text" id="ia_desc" placeholder="รายละเอียดแอป (ถ้ามี)">
        <select id="ia_os">
          <option value="iOS">ระบบ iOS</option>
          <option value="Android">ระบบ Android</option>
          <option value="iOS/Android">ระบบ iOS/Android</option>
        </select>
        <input type="number" id="ia_price" placeholder="ราคา (บาท)">
        <input type="text" id="ia_icon" placeholder="ลิงก์รูปภาพแอป/ไอคอน (URL)">
      </div>

      <div id="zone-product-status" style="display: none; margin-top: 10px;">
        <label style="font-size: 13px; color: #ccc;">สถานะแอป:</label>
        <select id="a_status">
          <option value="ready">พร้อมส่ง (สีเขียว)</option>
          <option value="notready">เมลไม่พร้อม / หมด (สีแดง)</option>
        </select>
      </div>

      <div id="zone-store" style="display: none; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.3);">
        <label style="font-size: 13px; color: #ccc;">สถานะร้าน:</label>
        <select id="store_status">
          <option value="open">เปิดร้าน (OPEN)</option>
          <option value="closed">ปิดร้าน (CLOSED)</option>
        </select>
        <input type="text" id="store_logo" placeholder="ลิงก์โลโก้ร้าน (URL)">
        <input type="text" id="store_media" placeholder="ลิงก์วิดีโอ/รูปภาพ โปรโมต (URL)">
        <input type="text" id="store_mediaText" placeholder="กล่องข้อความใต้การ์ดรูปวิดีโอ">
        <input type="text" id="store_line" placeholder="ช่องทางติดต่อ ไอดี Line (ใส่ @ ด้วย)">
        <input type="text" id="store_hours" placeholder="เวลาทำการ (เช่น 10:00 - 22:00)">
        <input type="text" id="store_warranty" placeholder="การรับประกัน (เงื่อนไข)">
      </div>

      <div id="zone-tabs" style="display: none; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.3);">
        <input type="text" id="new_tab_name" placeholder="ชื่อแท็บใหม่ที่ต้องการเพิ่ม">
        <button class="admin-btn" style="background:#9d00ff;" onclick="submitTabAction(event, 'add_tab')">➕ เพิ่มแท็บใหม่</button>
      </div>
      
      <div style="display: flex; gap: 10px; margin-top: 15px;" id="admin-action-btns">
        <button class="admin-btn product-btn" style="background:#00d300; color:#000;" onclick="submitAdminAction(event, 'add')">➕ เพิ่มสินค้า</button>
        <button class="admin-btn product-btn" style="background:#00F0FF; color:#000;" onclick="submitAdminAction(event, 'edit_product')">💾 บันทึกแก้ไข</button>
        <button class="admin-btn product-btn" style="background:#ff3b3b;" onclick="submitAdminAction(event, 'delete_product')">🗑️ ลบสินค้า</button>
        <button class="admin-btn store-btn" style="background:var(--secondary); display:none;" onclick="submitStoreAction(event)">💾 บันทึกข้อมูลร้าน</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==========================================
// การตั้งค่า & ข้อมูลพื้นฐาน
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbz2uKbrYR1HX4ofkMQ1Zt6fkBO4qvtEbZL6eZRPN2raaE2ZsJ49ZR9UrPmA7pomdjgJ/exec"; // ❌ ใส่ URL App Script
let allProducts = [];
let cart = [];
let currentTab = "info"; 
let storeInfo = {};
let tabsList = [];
let isAdmin = localStorage.getItem('isAdmin') === 'true';

let viewLevel = 'apps'; 
let selectedAppName = ''; 

if(isAdmin) document.getElementById('admin-badge').style.display = 'flex';

async function loadData() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    
    allProducts = data.products || [];
    storeInfo = data.storeInfo || {};
    tabsList = data.tabs || [];
    
    // ตั้งค่า Header
    if(storeInfo.welcome) document.getElementById('welcomeText').innerText = storeInfo.welcome;
    if(storeInfo.logo) document.getElementById('shopLogo').src = storeInfo.logo;
    
    updateShopStatus(storeInfo.status || 'open');
    renderTabs();
    switchTab('info'); // กลับมาใช้ข้อมูลร้านค้าเป็นหน้าแรกสุด
  } catch (err) {
    console.error("Error loading data:", err);
    document.getElementById('productGrid').innerHTML = "<p style='text-align:center;width:100%;color:#ccc;'>ไม่สามารถโหลดข้อมูลได้ โปรดรีเฟรช</p>";
  }
  document.getElementById('loadingOverlay').style.display = 'none';
}

function updateShopStatus(status) {
  const pill = document.getElementById('shopStatusPill');
  const text = document.getElementById('shopStatusText');
  pill.className = `shop-status status-${status}`;
  text.innerText = status === 'closed' ? 'CLOSED' : 'OPEN';
}

function renderTabs() {
  const tc = document.getElementById('tabContainer');
  let html = `<button class="tab-btn" onclick="switchTab('info')" id="tab-info">ข้อมูลร้าน</button>`;
  
  const predefinedOrder = ["แอพพรีเมี่ยม", "เติมเกม", "IOS-ANDROID", "แอพ-เกม iOS/Android"];
  let sortedTabs = [...tabsList].filter(t => t !== "ข้อมูลร้าน" && t !== "StoreInfo").sort((a, b) => {
     let idxA = predefinedOrder.indexOf(a); let idxB = predefinedOrder.indexOf(b);
     if(idxA === -1) idxA = 99; if(idxB === -1) idxB = 99; return idxA - idxB;
  });

  html += sortedTabs.map(t => `<button class="tab-btn" onclick="switchTab('${t}')" id="tab-${t.replace(/\s+/g, '-')}">${t}</button>`).join('');
  tc.innerHTML = html;
}

function switchTab(tabName) {
  currentTab = tabName;
  viewLevel = 'apps'; selectedAppName = '';

  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  const activeId = tabName === 'info' ? 'tab-info' : `tab-${tabName.replace(/\s+/g, '-')}`;
  const activeBtn = document.getElementById(activeId);
  if(activeBtn) activeBtn.classList.add('active');
  
  document.getElementById('currentTabTitle').innerText = tabName === 'info' ? 'ข้อมูลร้านค้า' : `หมวด: ${tabName}`;
  
  if(tabName === 'info') renderInfoPage();
  else renderProducts();
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  const sortType = document.getElementById('sortSelect').value;
  let products = allProducts.filter(p => p.tab === currentTab);
  
  if (sortType === 'name') products.sort((a,b) => (a.cat || a.name || '').localeCompare(b.cat || b.name || ''));
  if (sortType === 'price') products.sort((a,b) => a.price - b.price);

  let html = '';

  if (currentTab === 'แอพพรีเมี่ยม' || currentTab === 'เติมเกม') {
    if (viewLevel === 'apps') {
      let uniqueApps = {};
      products.forEach(p => {
        if (!uniqueApps[p.cat]) uniqueApps[p.cat] = { cat: p.cat, icon: p.icon, appDesc: p.appDesc };
      });

      html = Object.values(uniqueApps).map(app => `
        <div class="item-card" onclick="openPackages('${app.cat}')">
          ${app.icon ? `<img src="${app.icon}" onerror="this.style.display='none'" class="card-icon">` : '<div class="card-icon"></div>'}
          <div class="card-title">${app.cat || 'ไม่ระบุชื่อ'}</div>
          <div class="card-desc" style="color:var(--primary);">${app.appDesc || 'คลิกดูแพ็กเกจ'}</div>
        </div>
      `).join('');
    } else if (viewLevel === 'packages') {
      html += `<div style="grid-column: 1/-1;">
                  <div class="back-btn" onclick="backToApps()">⬅️ ย้อนกลับ</div>
                  <h3 style="color:var(--primary); font-size: 16px; margin-bottom: 5px;">📦 ${selectedAppName}</h3>
               </div>`;

      let pkgProducts = products.filter(p => p.cat === selectedAppName);
      let groups = {};
      pkgProducts.forEach(p => { let g = p.subCat || 'ทั่วไป'; if(!groups[g]) groups[g] = []; groups[g].push(p); });

      Object.keys(groups).forEach(g => {
        html += `<div class="group-header">📌 ${g}</div>`;
        html += groups[g].map(p => generateProductCard(p, false)).join('');
      });
    }
  } 
  else {
    html = products.map(p => generateProductCard(p, true)).join('');
  }

  if(!html) html = "<p style='grid-column:1/-1; text-align:center; color:#555;'>ไม่มีสินค้าในหมวดหมู่นี้</p>";
  grid.innerHTML = html;
}

function generateProductCard(p, isIosAndroid = false) {
  const selectedItem = cart.find(item => item.id === p.id);
  const isSelected = !!selectedItem;
  const statusClass = p.status === 'ready' ? 'status-ready' : 'status-notready';
  const imgHtml = p.icon ? `<img src="${p.icon}" onerror="this.style.display='none'" class="card-icon">` : '<div class="card-icon"></div>';
  const title = isIosAndroid ? p.cat : p.name;
  
  let osButtons = '';
  if (isIosAndroid && p.os) {
     const osList = p.os.includes('/') ? p.os.split('/') : [p.os];
     osButtons = `<div style="display:flex; gap:5px; margin-top:5px; width:100%;">`;
     osList.forEach(os => {
        const isOsSelected = isSelected && selectedItem.selectedOs === os;
        const btnClass = isOsSelected ? 'os-btn active' : 'os-btn';
        osButtons += `<button class="${btnClass}" onclick="toggleItemOs(event, '${p.id}', '${os}')">${os}</button>`;
     });
     osButtons += `</div>`;
  }

  const onClickAttr = !isIosAndroid ? `onclick="toggleItem('${p.id}')"` : `onclick="toggleItemOs(null, '${p.id}', '${p.os ? p.os.split('/')[0] : 'iOS'}')"`;

  return `
    <div class="item-card ${isSelected ? 'selected' : ''}" ${onClickAttr}>
      ${!isIosAndroid ? `<div class="check-circle"></div>` : ''}
      <div class="app-status ${statusClass}"></div>
      ${imgHtml}
      <div class="card-title">${title}</div>
      <div class="card-desc">${p.desc || ''}</div>
      ${osButtons}
      <div class="card-price">${p.price} บาท</div>
    </div>
  `;
}

function openPackages(appName) { selectedAppName = appName; viewLevel = 'packages'; renderProducts(); }
function backToApps() { viewLevel = 'apps'; selectedAppName = ''; renderProducts(); }

function renderInfoPage() {
  document.getElementById('productGrid').innerHTML = `
    <div style="background:var(--bg-card); padding:20px; border-radius:16px; grid-column: 1 / -1; border:1px solid rgba(255,255,255,0.1);">
      <h3 style="color:var(--primary); margin-bottom:15px;">ติดต่อร้านค้า</h3>
      ${storeInfo.mediaLink ? `<img src="${storeInfo.mediaLink}" onerror="this.style.display='none'" style="width:100%; border-radius:12px; margin-bottom:10px;">` : ''}
      ${storeInfo.mediaText ? `<p style="font-size:13px; color:#ccc; margin-bottom:15px;">${storeInfo.mediaText}</p>` : ''}
      <p style="margin-bottom:8px;"><b>💬 Line:</b> ${storeInfo.line || '-'}</p>
      <p style="margin-bottom:8px;"><b>⏰ เวลาทำการ:</b> ${storeInfo.hours || '-'}</p>
      <p><b>🛡️ การรับประกัน:</b> ${storeInfo.warranty || '-'}</p>
    </div>
  `;
}

function updateBottomBar() {
  const bar = document.getElementById('bottomBar');
  if (cart.length > 0) {
    bar.classList.add('active');
    document.getElementById('cartCount').innerText = cart.length;
    document.getElementById('cartTotal').innerText = calculateTotal();
  } else { bar.classList.remove('active'); }
}

function toggleItem(id) {
  const product = allProducts.find(p => p.id === id);
  if(!product) return;
  if (isAdmin) { openAdminForEdit(product); return; }
  const index = cart.findIndex(item => item.id === id);
  if (index > -1) cart.splice(index, 1); else cart.push(product);
  renderProducts(); updateBottomBar();
}

function toggleItemOs(event, id, os) {
  if (event) event.stopPropagation();
  const product = allProducts.find(p => p.id === id);
  if(!product) return;
  if (isAdmin) { openAdminForEdit(product); return; }
  const index = cart.findIndex(item => item.id === id);
  if (index > -1) {
    if (cart[index].selectedOs === os) cart.splice(index, 1); 
    else cart[index].selectedOs = os; 
  } else { cart.push({...product, selectedOs: os}); }
  renderProducts(); updateBottomBar();
}

function calculateTotal() {
  let total = 0;
  const iosItems = cart.filter(p => p.tab === "แอพ-เกม iOS/Android" || p.tab === "IOS-ANDROID");
  const otherItems = cart.filter(p => p.tab !== "แอพ-เกม iOS/Android" && p.tab !== "IOS-ANDROID");
  otherItems.forEach(p => total += Number(p.price));
  
  let promoCount = 0; let nonPromoTotal = 0;
  iosItems.forEach(p => {
    let price = Number(p.price);
    if (price >= 20 && price <= 25) promoCount++; else nonPromoTotal += price;
  });

  let promoTotal = 0;
  if (promoCount >= 30) promoTotal = 360 + ((promoCount - 30) * 20);
  else if (promoCount >= 15) promoTotal = 210 + ((promoCount - 15) * 20);
  else if (promoCount >= 8) promoTotal = 80 + ((promoCount - 8) * 20);
  else if (promoCount >= 3) promoTotal = 45 + ((promoCount - 3) * 20);
  else if (promoCount === 2 && iosItems.some(i=>Number(i.price)===25)) promoTotal = 45;
  else iosItems.filter(p => Number(p.price) >= 20 && Number(p.price) <= 25).forEach(p => promoTotal += Number(p.price));

  return total + promoTotal + nonPromoTotal;
}

function checkout() {
  if(cart.length === 0) return;
  let text = "🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n";
  cart.forEach((item, i) => { text += `${i+1}. ${item.cat || item.name} ${item.selectedOs ? '['+item.selectedOs+']' : ''} - ${item.price}฿\n`; });
  text += `---------------------------\nยอดรวม: ${calculateTotal()} บาท\nแจ้งไอดี / รอเช็คยอดได้เลยค่ะ 🙏`;
  
  navigator.clipboard.writeText(text).then(() => {
    alert("คัดลอกรายการสั่งซื้อแล้ว กำลังพาไปที่ LINE...");
    window.location.href = `https://line.me/R/ti/p/${storeInfo.line ? storeInfo.line.replace('@', '%40') : ''}`;
  }).catch(() => alert("คัดลอกไม่สำเร็จ"));
}

// ==========================================
// ระบบ Admin Panel 
// ==========================================
let clickCount = 0; let clickTimer;
function adminLoginClick() {
  clickCount++; clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
  if (clickCount >= 5) {
    clickCount = 0;
    if (!isAdmin) {
      if (prompt("ระบุรหัสผ่าน Admin:") === "170647") { 
        isAdmin = true; localStorage.setItem('isAdmin', 'true');
        document.getElementById('admin-badge').style.display = 'flex';
      }
    } else openAdmin();
  }
}

function openAdmin() { 
  document.getElementById('adminOverlay').style.display = 'flex'; 
  clearAdminForm(); 
  toggleAdminFields(); 
}

function closeAdmin() { document.getElementById('adminOverlay').style.display = 'none'; }

// เพิ่มฟังก์ชันล้างฟอร์มที่สมบูรณ์ ล้างทั้ง Input และ Dropdown
function clearAdminForm() { 
  document.querySelectorAll('.admin-form input').forEach(i => i.value=''); 
  document.getElementById('a_status').value = 'ready';
  document.getElementById('ia_os').value = 'iOS';
}

function toggleAdminFields() {
  const tab = document.getElementById('a_tab').value;
  ['zone-premium-game', 'zone-ios-android', 'zone-product-status', 'zone-store', 'zone-tabs'].forEach(id => document.getElementById(id).style.display = 'none');
  document.querySelectorAll('.product-btn').forEach(b => b.style.display = 'none'); document.querySelector('.store-btn').style.display = 'none';
  
  if (tab === "STORE_INFO") { document.getElementById('zone-store').style.display = 'block'; document.querySelector('.store-btn').style.display = 'block'; }
  else if (tab === "MANAGE_TABS") { document.getElementById('zone-tabs').style.display = 'block'; }
  else if (tab.includes("IOS")) { document.getElementById('zone-ios-android').style.display = 'block'; document.getElementById('zone-product-status').style.display = 'block'; document.querySelectorAll('.product-btn').forEach(b => b.style.display = 'block'); }
  else { document.getElementById('zone-premium-game').style.display = 'block'; document.getElementById('zone-product-status').style.display = 'block'; document.querySelectorAll('.product-btn').forEach(b => b.style.display = 'block'); }
}

// เพิ่มฟังก์ชันดึงข้อมูลเก่ามาใส่ฟอร์มที่ตกหล่นไป
function openAdminForEdit(product) {
  document.getElementById('adminOverlay').style.display = 'flex';
  document.getElementById('a_id').value = product.id;
  document.getElementById('a_tab').value = product.tab === "แอพ-เกม iOS/Android" ? "IOS-ANDROID" : product.tab;
  toggleAdminFields();
  
  document.getElementById('a_status').value = product.status || "ready";
  
  if (product.tab === "แอพ-เกม iOS/Android" || product.tab === "IOS-ANDROID") {
    document.getElementById('ia_cat').value = product.cat || product.name || "";
    document.getElementById('ia_desc').value = product.desc || ""; 
    document.getElementById('ia_os').value = product.os || "iOS";
    document.getElementById('ia_price').value = product.price || 0;
    document.getElementById('ia_icon').value = product.icon || "";
  } else {
    document.getElementById('pg_cat').value = product.cat || "";
    document.getElementById('pg_appDesc').value = product.appDesc || "";
    document.getElementById('pg_subCat').value = product.subCat || "";
    document.getElementById('pg_name').value = product.name || "";
    document.getElementById('pg_desc').value = product.desc || "";
    document.getElementById('pg_price').value = product.price || 0;
    document.getElementById('pg_icon').value = product.icon || "";
  }
}

async function submitStoreAction(event) {
  const btn = event.currentTarget; const originalText = btn.innerText; btn.innerText = "⏳...";
  const payload = {
    action: "save_store",
    status: document.getElementById('store_status').value,
    logo: document.getElementById('store_logo').value,
    mediaLink: document.getElementById('store_media').value,
    mediaText: document.getElementById('store_mediaText').value,
    line: document.getElementById('store_line').value,
    hours: document.getElementById('store_hours').value,
    warranty: document.getElementById('store_warranty').value
  };
  await sendAdminPost(payload, btn, originalText);
}

async function submitTabAction(event, actionType) {
  const btn = event.currentTarget; const originalText = btn.innerText; btn.innerText = "⏳...";
  const payload = { action: actionType, tabName: document.getElementById('new_tab_name').value };
  if(!payload.tabName) { alert("กรุณาใส่ชื่อแท็บ"); btn.innerText = originalText; return; }
  await sendAdminPost(payload, btn, originalText);
}

async function submitAdminAction(event, actionType) {
  const btn = event.currentTarget; const originalText = btn.innerText; btn.innerText = "⏳...";
  const tab = document.getElementById('a_tab').value;
  
  let payload = { action: actionType, id: document.getElementById('a_id').value, tab: tab, status: document.getElementById('a_status').value };
  
  if (tab === "IOS-ANDROID" || tab === "แอพ-เกม iOS/Android") {
    payload.name = document.getElementById('ia_cat').value; 
    payload.cat = document.getElementById('ia_cat').value;
    payload.desc = document.getElementById('ia_desc').value;
    payload.os = document.getElementById('ia_os').value;
    payload.price = Number(document.getElementById('ia_price').value) || 0;
    payload.icon = document.getElementById('ia_icon').value;
  } else {
    payload.cat = document.getElementById('pg_cat').value;
    payload.appDesc = document.getElementById('pg_appDesc').value;
    payload.subCat = document.getElementById('pg_subCat').value;
    payload.name = document.getElementById('pg_name').value;
    payload.desc = document.getElementById('pg_desc').value;
    payload.price = Number(document.getElementById('pg_price').value) || 0;
    payload.icon = document.getElementById('pg_icon').value;
  }

  if (actionType !== 'add' && !payload.id) {
    alert("กรุณาเลือกสินค้าที่ต้องการแก้ไข/ลบ ก่อนครับ!");
    btn.innerText = originalText; return;
  }
  await sendAdminPost(payload, btn, originalText);
}

async function sendAdminPost(payload, btn, originalText) {
  try {
    const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const result = await response.json();
    if(result.success) { alert("✅ สำเร็จ!"); closeAdmin(); loadData(); } else alert("❌ Error: " + result.error);
  } catch(err) { alert("❌ ตัดการเชื่อมต่อ"); }
  btn.innerText = originalText;
}

window.onload = loadData;
