<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer_Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================== CSS ธีมและโครงสร้างหลัก ================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #3B96F5;      
  --secondary: #FF4B7E;    
  --bg-main: #0A1D3A;      
  --bg-card: #E1E8EE;      
  --border-color: #C49646; 
  --text-muted: #555;
}

body { font-family: 'Kanit', sans-serif; background: var(--bg-main); color: #fff; overflow-x: hidden; padding-bottom: 110px; min-height: 100vh; }

.floating-emojis { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
.floating-emojis span { position: absolute; bottom: -50px; font-size: 24px; opacity: 0; animation: floatUp 12s infinite linear, twinkle 4s infinite ease-in-out; }
@keyframes floatUp { 0% { transform: translateY(0) rotate(0deg) scale(0.8); } 100% { transform: translateY(-120vh) rotate(360deg) scale(1.2); } }
@keyframes twinkle { 0%, 100% { opacity: 0.2; text-shadow: 0 0 5px rgba(255,255,255,0.1); } 50% { opacity: 0.8; text-shadow: 0 0 15px rgba(59, 150, 245, 0.8); } }

.shop-status { position: fixed; top: 15px; left: 15px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; z-index: 1000; border: 2px solid var(--border-color); background: rgba(10,29,58,0.8); backdrop-filter: blur(5px); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 1.5s infinite; background: #fff; }
.status-open { border-color: #00d300; } .status-open .status-dot { background: #00d300; box-shadow: 0 0 8px #00d300; }
.status-closed { border-color: #ff3b3b; } .status-closed .status-dot { background: #ff3b3b; box-shadow: 0 0 8px #ff3b3b; }
@keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } }

.hero { background: linear-gradient(135deg, var(--bg-main) 0%, rgba(59,150,245,0.2) 100%); padding: 60px 20px 55px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; border-bottom: 2px solid var(--border-color); margin-bottom: 45px; box-shadow: 0 4px 30px rgba(10,29,58,0.5); }
#shopLogo { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 2px solid var(--border-color); box-shadow: 0 0 15px rgba(196,150,70,0.4); background: #fff; }
.hero-title { font-family: 'Mitr', sans-serif; font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 4px; letter-spacing: 0.5px; text-shadow: 0 0 15px rgba(59,150,245,0.6); cursor: pointer; user-select: none; }
.hero-sub { font-size: 13px; color: rgba(255,255,255,0.85); cursor: pointer; }

.tab-container { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); display: flex; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 30px; padding: 4px; width: 95%; max-width: 500px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.4); overflow-x: auto; scrollbar-width: none; justify-content: flex-start; }
.tab-container::-webkit-scrollbar { display: none; }
.tab-btn { flex: 0 0 auto; padding: 8px 16px; border-radius: 25px; border: none; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; background: transparent; color: var(--text-muted); white-space: nowrap; }
.tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; box-shadow: 0 2px 10px rgba(255,75,126,0.3); }

.content { max-width: 800px; margin: 0 auto; padding: 0 20px 50px; position: relative; z-index: 5; }
.filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.sort-select { background: var(--bg-card); color: #000; border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 10px; font-family: 'Kanit'; font-size: 13px; outline: none; }

.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.item-card { background: var(--bg-card); border: 1px solid rgba(196,150,70,0.5); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; cursor: pointer; transition: all 0.2s ease; color: #000; min-height: 175px; }
.item-card.selected { border-color: var(--primary); background: rgba(59, 150, 245, 0.1); }
.card-icon { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; margin-bottom: 10px; background: #ccc; }
.card-title { font-size: 14px; font-weight: 600; margin-top: 4px; color: var(--bg-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

/* รองรับการเว้นบรรทัดสำหรับรายละเอียด */
.card-desc, .package-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; white-space: pre-line; }

.card-price { font-size: 14px; font-weight: 700; color: var(--secondary); margin-top: 8px; }

/* ปุ่มแก้ไข/ลบ สำหรับแอดมิน */
.admin-card-actions { display: flex; gap: 5px; width: 100%; margin-top: 12px; z-index: 10; }
.btn-card-edit { flex: 1; background: #3B96F5; color: #fff; border: none; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: 'Kanit'; font-weight: 600; }
.btn-card-del { flex: 1; background: #ff3b3b; color: #fff; border: none; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: 'Kanit'; font-weight: 600; }

.check-circle { position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.8); z-index: 2; transition: 0.2s; }
.item-card.selected .check-circle { background: var(--primary); border-color: var(--primary); }
.item-card.selected .check-circle::after { content: '✓'; color: #fff; font-size: 12px; opacity: 1; font-weight: bold; }

/* 🚀 ปรับแก้ Req 2: ป้ายสถานะแอป ขยายพอดีคำ สไตล์เดียวกับป้ายร้าน */
.app-status {
  position: absolute; top: 10px; right: 10px;
  padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #fff;
  display: flex; align-items: center; z-index: 2;
  border: 1px solid; background: rgba(10,29,58,0.85); backdrop-filter: blur(5px);
  white-space: nowrap;
}
.status-ready { border-color: #00d300; color: #00d300; } 
.status-notready { border-color: #ff3b3b; color: #ff3b3b; }

.os-btn { background: #f0f4f8; color: #555; border: 1px solid #ccc; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; font-family: 'Kanit'; transition: 0.2s; flex: 1; text-align: center; font-weight: 600; margin: 0 2px; }
.os-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(59, 150, 245, 0.4); }

.group-header { background: var(--bg-card); color: var(--bg-main); border-left: 4px solid var(--primary); padding: 8px 12px; margin: 15px 0 10px; border-radius: 6px; font-weight: 600; font-size: 14px; grid-column: 1 / -1; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: left; }
.back-btn { display: inline-block; background: var(--primary); color:#fff; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; margin-bottom: 15px; font-weight:600; }

.package-card { background: var(--bg-card); border: 1px solid rgba(196,150,70,0.5); border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; cursor: pointer; position: relative; color: #000; transition: 0.2s; margin-bottom: 10px; }
.package-card.selected { border-color: var(--primary); background: rgba(59, 150, 245, 0.1); }
.package-card .check-circle { position: relative; top: auto; left: auto; width: 22px; height: 22px; flex-shrink: 0; margin-right: 12px; border: 2px solid rgba(0,0,0,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; background: #fff; transition: 0.2s; }
.package-card.selected .check-circle { background: var(--primary); border-color: var(--primary); }
.package-card.selected .check-circle::after { content: '✓'; color: #fff; font-size: 12px; opacity: 1; font-weight: bold; }
.package-details { flex: 1; text-align: left; }
.package-title { font-size: 15px; font-weight: 600; color: var(--bg-main); }
.package-price { font-size: 16px; font-weight: 700; color: var(--secondary); margin-left: 15px; white-space: nowrap; }

.info-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px 24px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2); color: #000; }
.info-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px dashed rgba(0,0,0,0.1); font-size: 14px; }
.info-row span:first-child { color: var(--primary); font-weight: 600; }

.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 29, 58, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--primary); padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
.bottom-bar.active { transform: translateY(0); }
.bb-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; border-radius: 25px; padding: 12px 24px; font-weight: 600; font-family: 'Kanit'; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 75, 126, 0.4); }

#admin-badge { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; background: #fff; border-radius: 50%; display: none; justify-content: center; align-items: center; color: #000; font-size: 30px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 999; cursor: pointer; border: 2px solid #ddd; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; }
.loader { border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.admin-modal { background: #fff; color: #000; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; border-radius: 16px; padding: 20px; position: relative; }
.admin-form input, .admin-form select, .admin-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Kanit'; }
.admin-btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-family: 'Kanit'; font-weight: 600; color:#fff;}

.admin-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; background: #fff;}
.admin-list-item:last-child { border-bottom: none; }
.admin-list-info { display: flex; flex-direction: column; flex: 1; }
.admin-list-actions { display: flex; gap: 8px; }
.btn-sm-edit { background: #ff9800; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
.btn-sm-del { background: #ff3b3b; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<div class="floating-emojis">
  <span style="left: 15%; animation-delay: 0s;">🎐</span>
  <span style="left: 35%; animation-delay: 3s;">🍃</span>
  <span style="left: 55%; animation-delay: 1s;">🌌</span>
  <span style="left: 75%; animation-delay: 4s;">🎐</span>
  <span style="left: 90%; animation-delay: 2s;">🍃</span>
</div>

<div class="shop-status status-open" id="shopStatusPill"><div class="status-dot"></div><span id="shopStatusText">OPEN</span></div>
<div id="admin-badge" onclick="openAdmin()">+</div>

<div class="hero">
  <img src="https://via.placeholder.com/190" id="shopLogo" alt="Logo" onerror="this.style.display='none'">
  <div class="hero-title" id="shopNameBtn">Wanderer_Shop</div>
  <div class="hero-sub" id="welcomeText">ยินดีต้อนรับสู่ร้าน Wanderer_Shop</div>
  <div class="tab-container" id="tabContainer"></div>
</div>

<div class="content">
  <div class="filter-row">
    <span style="font-size: 15px; font-weight: 600; color: #fff;" id="currentTabTitle">กำลังโหลด...</span>
    <select class="sort-select" id="sortSelect" onchange="renderProducts()">
      <option value="name">เรียงอักษร</option>
      <option value="price">เรียงราคา</option>
    </select>
  </div>
  <div class="grid-container" id="productGrid"></div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div>
    <div style="font-size: 12px; color: #ccc;">เลือก <span id="cartCount">0</span> รายการ</div>
    <div style="font-size: 20px; font-weight: 700; color: #fff;"><span id="cartTotal">0</span>฿</div>
  </div>
  <button class="bb-btn" onclick="checkout()">สั่งซื้อสินค้า</button>
</div>

<div class="overlay" id="loadingOverlay"><div class="loader"></div></div>

<div class="overlay" id="adminOverlay">
  <div class="admin-modal">
    <span style="position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 22px; color: #ff3b3b;" onclick="closeAdmin()">×</span>
    <h2 style="margin-bottom: 15px; color: var(--primary);">จัดการระบบ (Admin)</h2>
    <div class="admin-form">
      <input type="hidden" id="a_id"> 
      <label style="font-size: 13px; color: #555; font-weight: bold;">เลือกหมวดหมู่ที่ต้องการจัดการ:</label>
      <select id="a_tab" onchange="toggleAdminFields()" style="background:#f0f4f8; border-color:var(--primary); font-weight:bold;">
        <option value="STORE_INFO">⚙️ ข้อมูลร้านค้า</option>
        <option value="แอพพรีเมี่ยม">📦 สินค้า: แอพพรีเมี่ยม</option>
        <option value="เติมเกม">🎮 สินค้า: เติมเกม</option>
        <option value="IOS-ANDROID">📱 สินค้า: IOS-ANDROID</option>
        <option value="MANAGE_TABS">📁 จัดการแท็บ (เพิ่มแท็บใหม่)</option>
      </select>
      
      <div id="zone-premium-game" style="display:none; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
        <input type="text" id="pg_cat" placeholder="ชื่อแอปหลัก / หมวดหมู่">
        <textarea id="pg_appDesc" placeholder="รายละเอียดใต้ชื่อแอป (ขึ้นบรรทัดใหม่ได้)" rows="3"></textarea>
        <input type="text" id="pg_subCat" placeholder="หมวดหมู่แพ็กเกจ [จัดกลุ่ม]">
        <input type="text" id="pg_name" placeholder="ชื่อแพ็กเกจย่อย">
        <textarea id="pg_desc" placeholder="รายละเอียดแพ็กเกจย่อย (ขึ้นบรรทัดใหม่ได้)" rows="2"></textarea>
        <input type="number" id="pg_price" placeholder="ราคา (บาท)">
        <input type="text" id="pg_icon" placeholder="รูปลิงก์ไอคอนแอป">
      </div>

      <div id="zone-ios-android" style="display:none; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
        <input type="text" id="ia_cat" placeholder="ชื่อแอป">
        <textarea id="ia_desc" placeholder="รายละเอียด (ขึ้นบรรทัดใหม่ได้)" rows="3"></textarea>
        
        <label style="font-size: 13px; color: #555; display:block; margin-top:5px; margin-bottom:5px;">ระบบที่รองรับ:</label>
        <div style="display:flex; gap: 15px; margin-bottom: 15px; border: 1px solid #eee; padding: 10px; border-radius: 8px; background: #fafafa;">
          <label style="font-size: 14px; font-weight: 600;"><input type="checkbox" id="os_ios" value="iOS" style="width: auto; margin-right: 5px;"> iOS</label>
          <label style="font-size: 14px; font-weight: 600;"><input type="checkbox" id="os_android" value="Android" style="width: auto; margin-right: 5px;"> Android</label>
        </div>

        <input type="number" id="ia_price" placeholder="ราคา (บาท)">
        <input type="text" id="ia_icon" placeholder="รูปลิงก์ไอคอนแอป">
      </div>
      
      <div id="zone-product-status" style="display:none; margin-top: 10px;">
        <label style="font-size: 13px; color: #555;">สถานะแอป:</label>
        <select id="a_status" style="font-weight: bold;">
          <option value="ready">🟢 พร้อมส่ง</option>
          <option value="notready">🔴 เมลไม่พร้อม / ระบบพัง</option>
        </select>
      </div>

      <div id="zone-store" style="display:none; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
        <label style="font-size: 13px; color: #555;">สถานะร้าน:</label>
        <select id="store_status">
          <option value="open">เปิดร้าน (OPEN)</option>
          <option value="closed">ปิดร้าน (CLOSED)</option>
          <option value="pause">พักส่ง (PAUSE)</option>
          <option value="slow">ตอบช้า (SLOW)</option>
        </select>
        <input type="text" id="store_logo" placeholder="ลิงก์โลโก้ร้าน (URL)">
        <input type="text" id="store_media" placeholder="ลิงก์วิดีโอ/รูปภาพ โปรโมต (URL)">
        <input type="text" id="store_mediaText" placeholder="กล่องข้อความใต้การ์ดรูปวิดีโอ">
        <input type="text" id="store_line" placeholder="ช่องทางติดต่อ ไอดี Line (ใส่ @ ด้วย)">
        <input type="text" id="store_hours" placeholder="เวลาทำการ (เช่น 10:00 - 22:00)">
        <input type="text" id="store_warranty" placeholder="การรับประกัน (เงื่อนไข)">
      </div>

      <div id="zone-tabs" style="display:none; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
        <input type="text" id="new_tab_name" placeholder="ชื่อแท็บใหม่ที่ต้องการเพิ่ม">
        <button class="admin-btn" style="background:#8b5cf6;" onclick="submitTabAction(event, 'add_tab')">➕ เพิ่มแท็บใหม่</button>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 15px;" id="admin-action-btns">
        <button class="admin-btn product-btn" style="background:#00d300;" onclick="submitAdminAction(event, 'add')">➕ เพิ่มสินค้าใหม่</button>
        <button class="admin-btn product-btn" style="background:#3B96F5;" onclick="submitAdminAction(event, 'edit_product')">💾 บันทึกแก้ไข</button>
        <button class="admin-btn product-btn" style="background:#ff3b3b;" onclick="submitAdminAction(event, 'delete_product')">🗑️ ลบสินค้า</button>
        <button class="admin-btn store-btn" style="background:#3B96F5; display:none;" onclick="submitStoreAction(event)">💾 บันทึกข้อมูลร้าน</button>
      </div>

      <div id="admin-product-list-container" style="display:none; margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h4 style="color: var(--primary); font-size: 15px;">📦 สินค้าในแท็บนี้</h4>
        </div>
        <div id="admin-product-list" style="max-height: 250px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 5px; background: #fafafa; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);">
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz8t4RtNJ5yqJttQP_G4IqsS9p_pesH4kf-xcziyZVQ_O7vYlmEjG2wVqJCljFl2Noa/exec
"; 
let allProducts = []; let cart = []; let currentTab = "info"; let storeInfo = {}; let tabsList = [];
let viewLevel = 'apps'; let selectedAppName = ''; 

let isAdmin = false;

// Hidden Login
let clickCount = 0; let clickTimer;
document.getElementById('shopNameBtn').addEventListener('click', () => {
  clickCount++; clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
  if (clickCount >= 5) {
    clickCount = 0;
    if (!isAdmin) {
      if (prompt("รหัสผ่าน Admin:") === "170647") { 
        isAdmin = true; 
        document.getElementById('admin-badge').style.display = 'flex';
        alert("เข้าสู่ระบบแอดมินสำเร็จ");
        renderProducts(); 
      } else { alert("รหัสผ่านผิด!"); }
    } else { openAdmin(); }
  }
});

async function loadData() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    
    // 🚀 ปรับแก้ Req 5: สร้าง ID ชั่วคราวให้สินค้าที่ไม่มี ID (แก้บั๊กกดลงตะกร้าไม่ได้)
    allProducts = data.products.map((p, i) => {
        if (!p.id) p.id = 'temp_' + i;
        return p;
    }) || [];
    
    storeInfo = data.storeInfo || {}; tabsList = data.tabs || [];
    
    const welcomeEl = document.getElementById('welcomeText');
    if(storeInfo.welcome) welcomeEl.innerText = storeInfo.welcome;
    if(storeInfo.logo) document.getElementById('shopLogo').src = storeInfo.logo;
    
    updateShopStatus(storeInfo.status || 'open');
    renderTabs(); switchTab('info'); 
    
    if (isAdmin && document.getElementById('adminOverlay').style.display === 'flex') {
        renderAdminProductList(document.getElementById('a_tab').value);
    }
  } catch (err) { 
    console.error(err);
    document.getElementById('productGrid').innerHTML = "<p style='text-align:center;width:100%;color:#fff;'>ไม่สามารถโหลดข้อมูลได้ โปรดรีเฟรช</p>"; 
  }

}

function updateShopStatus(status) {
  const pill = document.getElementById('shopStatusPill');
  const text = document.getElementById('shopStatusText');
  pill.className = `shop-status status-${status}`;
  text.innerText = status.toUpperCase();
}

function renderTabs() {
  const tc = document.getElementById('tabContainer');
  let html = `<button class="tab-btn active" onclick="switchTab('info')" id="tab-info">ข้อมูลร้าน</button>`;
  const predefinedOrder = ["แอพพรีเมี่ยม", "เติมเกม", "IOS-ANDROID", "แอพ-เกม iOS/Android"];
  let sortedTabs = [...tabsList].filter(t => t !== "ข้อมูลร้าน" && t !== "StoreInfo").sort((a, b) => {
     let idxA = predefinedOrder.indexOf(a); let idxB = predefinedOrder.indexOf(b);
     if(idxA === -1) idxA = 99; if(idxB === -1) idxB = 99; return idxA - idxB;
  });

  html += sortedTabs.map(t => `<button class="tab-btn" onclick="switchTab('${t}')" id="tab-${t.replace(/\s+/g, '-')}">${t}</button>`).join('');
  tc.innerHTML = html;
}

function switchTab(tabName) {
  currentTab = tabName; viewLevel = 'apps'; selectedAppName = '';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById(tabName === 'info' ? 'tab-info' : `tab-${tabName.replace(/\s+/g, '-')}`);
  if(activeBtn) activeBtn.classList.add('active');
  
  document.getElementById('currentTabTitle').innerText = tabName === 'info' ? 'ข้อมูลร้านค้า' : `รายการสินค้า`;
  if(tabName === 'info') renderInfoPage(); else renderProducts();
}

function getAppIcon(appName) {
  const app = allProducts.find(p => p.cat === appName && p.icon);
  return app ? app.icon : null;
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  const sortType = document.getElementById('sortSelect').value;
  let products = allProducts.filter(p => p.tab === currentTab);
  
  if (sortType === 'name') products.sort((a,b) => (a.cat || a.name || '').localeCompare(b.cat || b.name || ''));
  if (sortType === 'price') products.sort((a,b) => a.price - b.price);

  let html = '';

  if (currentTab === 'แอพพรีเมี่ยม' || currentTab === 'เติมเกม') {
    if (viewLevel === 'apps') {
      let uniqueApps = {};
      products.forEach(p => { if (!uniqueApps[p.cat]) uniqueApps[p.cat] = { cat: p.cat, icon: p.icon || getAppIcon(p.cat), appDesc: p.appDesc }; });
      html = Object.values(uniqueApps).map(app => `
        <div class="item-card" onclick="openPackages('${app.cat}')">
          ${app.icon ? `<img src="${app.icon}" onerror="this.style.display='none'" class="card-icon">` : '<div class="card-icon"></div>'}
          <div class="card-title">${app.cat || 'ไม่ระบุชื่อ'}</div>
          ${app.appDesc ? `<div class="card-desc" style="color:var(--primary); font-weight:600; width:100%;">${app.appDesc}</div>` : ''}
        </div>
      `).join('');
    } else {
      let pkgProducts = products.filter(p => p.cat === selectedAppName);
      let appDescription = pkgProducts.length > 0 ? (pkgProducts[0].appDesc || '') : '';
      
      // 🚀 ปรับแก้ Req 3: โชว์รายละเอียดใต้ชื่อแอปในหน้าแพ็กเกจย่อย
      let descHtml = appDescription ? `<div style="color:#ccc; font-size:13px; margin: 10px 0 20px; white-space: pre-line; line-height: 1.4;">${appDescription}</div>` : '';
      
      html += `<div style="grid-column: 1/-1; text-align:center;">
                  <div class="back-btn" onclick="backToApps()">⬅️ กลับหน้าแอป</div>
                  <h3 style="color:#fff; font-size: 18px; margin-bottom: 5px;">📦 ${selectedAppName}</h3>
                  ${descHtml}
               </div>`;
               
      let groups = {};
      pkgProducts.forEach(p => { 
        if(!p.icon) p.icon = getAppIcon(p.cat); 
        let g = p.subCat || 'ทั่วไป'; 
        if(!groups[g]) groups[g] = []; 
        groups[g].push(p); 
      });

      Object.keys(groups).forEach(g => {
        html += `<div class="group-header" style="grid-column: 1/-1;">📌 ${g}</div>`;
        html += `<div style="grid-column: 1/-1;">`;
        html += groups[g].map(p => generatePackageCard(p)).join('');
        html += `</div>`;
      });
    }
  } 
  else if (currentTab === 'แอพ-เกม iOS/Android' || currentTab === 'IOS-ANDROID') {
      let groupedApps = {};
      
      products.forEach(p => {
        let rawTitle = p.cat || p.name || '';
        let cleanTitle = rawTitle.replace(/\[iOS\]/i, '').replace(/\[Android\]/i, '').replace(/\(iOS\)/i, '').replace(/\(Android\)/i, '').trim();
        
        if (!groupedApps[cleanTitle]) {
          groupedApps[cleanTitle] = {
            title: cleanTitle,
            icon: p.icon || getAppIcon(cleanTitle),
            desc: p.desc || '',
            status: p.status || 'ready',
            items: []
          };
        }
        groupedApps[cleanTitle].items.push(p);
      });

      html = Object.values(groupedApps).map(app => {
        let isCardSelected = false;
        let osButtons = `<div style="display:flex; gap:5px; margin-top:8px; width:100%; justify-content:center;">`;
        
        let prices = [];
        app.items.forEach(item => {
          prices.push(item.price);
          let itemOsList = item.os ? item.os.split('/') : [];
          if (itemOsList.length === 0) {
              if ((item.cat || item.name || '').match(/Android/i)) itemOsList.push('Android');
              else itemOsList.push('iOS');
          }

          itemOsList.forEach(os => {
            let isSelected = cart.some(c => c.id === item.id && c.selectedOs === os);
            if (isSelected) isCardSelected = true;
            let btnClass = isSelected ? 'os-btn active' : 'os-btn';
            osButtons += `<button class="${btnClass}" onclick="toggleItemOs(event, '${item.id}', '${os}')">${os}</button>`;
          });
        });
        osButtons += `</div>`;

        let minPrice = Math.min(...prices);
        let maxPrice = Math.max(...prices);
        let priceText = minPrice === maxPrice ? `${minPrice} ฿` : `${minPrice} - ${maxPrice} ฿`;

        let statusClass = app.status === 'ready' ? 'status-ready' : 'status-notready';
        let statusText = app.status === 'ready' ? '🟢 พร้อมส่ง' : '🔴 ไม่พร้อม';

        return `
          <div class="item-card ${isCardSelected ? 'selected' : ''}">
            <div class="app-status ${statusClass}">${statusText}</div>
            ${app.icon ? `<img src="${app.icon}" onerror="this.style.display='none'" class="card-icon">` : '<div class="card-icon"></div>'}
            <div class="card-title">${app.title}</div>
            <div class="card-desc">${app.desc}</div>
            ${osButtons}
            <div class="card-price" style="margin-top: 5px;">${priceText}</div>
          </div>
        `;
      }).join('');
  }
  else {
    html = products.map(p => generateProductCard(p, true)).join('');
  }
  
  if(!html) html = "<p style='grid-column:1/-1; text-align:center; color:#ccc;'>ไม่มีสินค้าในหมวดหมู่นี้</p>";
  grid.innerHTML = html;
}

function generatePackageCard(p) {
  const isSelected = cart.some(item => item.id === p.id);
  const adminButtons = isAdmin ? `
    <div class="admin-card-actions" style="margin-top: 8px;">
      <button class="btn-card-edit" onclick="event.stopPropagation(); openAdminForEditById('${p.id}')">✏️ แก้ไข</button>
      <button class="btn-card-del" onclick="event.stopPropagation(); quickDelete('${p.id}', '${p.tab}')">🗑️ ลบ</button>
    </div>
  ` : '';

  return `
    <div class="package-card ${isSelected ? 'selected' : ''}" ${!isAdmin ? `onclick="toggleItem('${p.id}')"` : ''}>
      ${!isAdmin ? `<div class="check-circle"></div>` : ''}
      <div style="width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-right:12px; ${p.status === 'ready' ? 'background:#00d300; box-shadow:0 0 5px #00d300;' : 'background:#ff3b3b; box-shadow:0 0 5px #ff3b3b;'}"></div>
      <div class="package-details">
        <div class="package-title">${p.name}</div>
        ${p.desc ? `<div class="package-desc">${p.desc}</div>` : ''}
        ${adminButtons}
      </div>
      <div class="package-price">${p.price} ฿</div>
    </div>
  `;
}

function generateProductCard(p, isIosAndroid = false) {
  const imgHtml = p.icon ? `<img src="${p.icon}" onerror="this.style.display='none'" class="card-icon">` : '<div class="card-icon"></div>';
  const title = isIosAndroid ? p.cat : p.name;
  const statusClass = p.status === 'ready' ? 'status-ready' : 'status-notready';
  const statusText = p.status === 'ready' ? '🟢 พร้อมส่ง' : '🔴 ไม่พร้อม';
  let isCardSelected = cart.some(item => item.id === p.id);

  return `
    <div class="item-card ${isCardSelected ? 'selected' : ''}" onclick="toggleItem('${p.id}')">
      <div class="check-circle"></div>
      <div class="app-status ${statusClass}">${statusText}</div>
      ${imgHtml}
      <div class="card-title">${title}</div>
      <div class="card-desc">${p.desc || ''}</div>
      <div class="card-price">${p.price} ฿</div>
    </div>
  `;
}

function toggleItem(id) {
  const p = allProducts.find(x => x.id === id); if(!p) return;
  const idx = cart.findIndex(x => x.id === id);
  if (idx > -1) cart.splice(idx, 1); else cart.push(p);
  renderProducts(); updateBottomBar();
}

function toggleItemOs(e, id, os) {
  if(e) e.stopPropagation();
  const p = allProducts.find(x => x.id === id); if(!p) return;
  
  const idx = cart.findIndex(x => x.id === id && x.selectedOs === os);
  
  if (idx > -1) { cart.splice(idx, 1); } 
  else { cart.push({...p, selectedOs: os}); }
  renderProducts(); updateBottomBar();
}

function updateBottomBar() {
  const bar = document.getElementById('bottomBar');
  if (cart.length > 0) { 
    bar.classList.add('active'); 
    document.getElementById('cartCount').innerText = cart.length; 
    document.getElementById('cartTotal').innerText = calculateTotal();
  } else { bar.classList.remove('active'); }
}

function calculateTotal() {
  let total = 0;
  const iosItems = cart.filter(p => p.tab === "แอพ-เกม iOS/Android" || p.tab === "IOS-ANDROID");
  const otherItems = cart.filter(p => p.tab !== "แอพ-เกม iOS/Android" && p.tab !== "IOS-ANDROID");
  
  otherItems.forEach(p => total += Number(p.price));

  let promoApps = []; let nonPromoTotal = 0;
  iosItems.forEach(p => {
    let price = Number(p.price);
    if (price >= 20 && price <= 25) { promoApps.push(price); } 
    else { nonPromoTotal += price; }
  });

  promoApps.sort((a, b) => b - a); 
  let promoTotal = 0; let count = promoApps.length; let idx = 0;

  while (count > 0) {
    if (count >= 30) { promoTotal += 360; count -= 30; idx += 30; }
    else if (count >= 15) { promoTotal += 210; count -= 15; idx += 15; }
    else if (count >= 8) { promoTotal += 80; count -= 8; idx += 8; }
    else if (count >= 3) { promoTotal += 45; count -= 3; idx += 3; }
    else if (count === 2 && promoApps[idx] === 25 && promoApps[idx+1] === 25) { promoTotal += 45; count -= 2; idx += 2; }
    else { promoTotal += promoApps[idx]; count -= 1; idx += 1; }
  }

  return total + promoTotal + nonPromoTotal;
}

function checkout() {
  if(cart.length === 0) return;
  let text = ""; let total = calculateTotal(); const mainTab = cart[0].tab;

  if (mainTab === "แอพ-เกม iOS/Android" || mainTab === "IOS-ANDROID") {

    cart.forEach(item => { 
        let cleanName = (item.cat || item.name || '').replace(/\[iOS\]/i, '').replace(/\[Android\]/i, '').trim();
        text += `♡ 🍃 ݂  ${cleanName} [${item.selectedOs || item.os || 'iOS'}] 𓈒\n`; 
    });
    text += `---------------------------\nรบกวนรอแม่ค้าเช็คเมล-ยอดและส่งเลขบัญชีให้ทีครับ/ค่ะ 🙏`;
  } else if (mainTab === "เติมเกม") {
    text = `🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n`;
    cart.forEach((item, index) => {
      let title = [item.cat, item.appDesc].filter(Boolean).join(' ');
      let pkg = [item.subCat, item.name].filter(Boolean).join(' ');
      text += `${index + 1}. ${title}\n    แพ็กเกจ: ${pkg}\n    ราคา: ${item.price} บาท\n`;
    });
    text += `---------------------------\n*ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\n*แจ้งไอดี ได้เลยค่ะ*`;
  } else {
    text = `🛒 รายการสั่งซื้อ (Wanderer Shop)\n---------------------------\n`;
    cart.forEach((item, index) => {
      let title = [item.cat, item.appDesc].filter(Boolean).join(' ');
      let subDetails = [item.name, item.desc].filter(Boolean).join('   ');
      let pkg = item.subCat || '';
      if (subDetails) pkg += ` (${subDetails})`;
      text += `${index + 1}. ${title}\n    แพ็กเกจ: ${pkg}\n   ราคา: ${item.price} บาท\n`;
    });
    text += `---------------------------\n*ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\nรบกวนรอแอดมินตอบก่อนค่อยโอนนะคะ`;
  }

  navigator.clipboard.writeText(text).then(() => {
    alert("คัดลอกรายการสั่งซื้อแล้ว กำลังพาไปที่ LINE...");
    window.location.href = `https://line.me/R/ti/p/${storeInfo.line ? storeInfo.line.replace('@','%40') : ''}`;
  }).catch(() => alert("คัดลอกไม่สำเร็จ รบกวนแคปหน้าจอส่งแม่ค้าได้เลยค่ะ"));
}

  document.getElementById('os_ios').checked = false; document.getElementById('os_android').checked = false;

function toggleAdminFields() {
  const tab = document.getElementById('a_tab').value;

function openAdminForEdit(product) {
  document.getElementById('adminOverlay').style.display = 'flex';

  document.getElementById('a_tab').value = product.tab.includes("IOS") ? "IOS-ANDROID" : product.tab;

    document.getElementById('ia_cat').value = product.cat || product.name || ""; document.getElementById('ia_desc').value = product.desc || ""; 
    document.getElementById('ia_price').value = product.price || 0; document.getElementById('ia_icon').value = product.icon || "";

    document.getElementById('os_android').checked = product.os ? product.os.includes('Android') : false;
  } else {
    document.getElementById('pg_cat').value = product.cat || ""; document.getElementById('pg_appDesc').value = product.appDesc || "";
    document.getElementById('pg_subCat').value = product.subCat || ""; document.getElementById('pg_name').value = product.name || "";
    document.getElementById('pg_desc').value = product.desc || ""; document.getElementById('pg_price').value = product.price || 0; document.getElementById('pg_icon').value = product.icon || "";
  }
}

async function quickDelete(id, tab) {
  if(!confirm("ยืนยันการลบสินค้านี้ใช่หรือไม่?")) return;
  const payload = { action: 'delete_product', id: id, tab: tab };
  try {
    const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const result = await response.json();
    if(result.success) { 
        alert("✅ ลบสินค้าสำเร็จ!"); 
        await loadData(); 
        clearAdminForm();
    } else alert("❌ Error: " + result.error);
  } catch(err) { alert("❌ ตัดการเชื่อมต่อเซิร์ฟเวอร์"); }
}

async function submitAdminAction(event, actionType) {
  const btn = event.currentTarget; const originalText = btn.innerText; btn.innerText = "⏳...";
  const tab = document.getElementById('a_tab').value;
  let payload = { action: actionType, id: document.getElementById('a_id').value, tab: tab, status: document.getElementById('a_status').value };
  
  if (tab.includes("IOS")) {
    let osArr = [];
    if(document.getElementById('os_ios').checked) osArr.push('iOS');
    if(document.getElementById('os_android').checked) osArr.push('Android');
    payload.os = osArr.join('/');

    if(!payload.os) { alert("กรุณาเลือกระบบปฏิบัติการอย่างน้อย 1 อย่าง"); btn.innerText = originalText; return; }

    payload.name = document.getElementById('ia_cat').value; payload.cat = document.getElementById('ia_cat').value;
    payload.desc = document.getElementById('ia_desc').value; payload.price = Number(document.getElementById('ia_price').value) || 0; payload.icon = document.getElementById('ia_icon').value;
  } else {
    payload.cat = document.getElementById('pg_cat').value; payload.appDesc = document.getElementById('pg_appDesc').value;
    payload.subCat = document.getElementById('pg_subCat').value; payload.name = document.getElementById('pg_name').value;
    payload.desc = document.getElementById('pg_desc').value; payload.price = Number(document.getElementById('pg_price').value) || 0; payload.icon = document.getElementById('pg_icon').value;
  }
  
  if (actionType !== 'add' && !payload.id) { alert("กรุณาเลือกสินค้าจากลิสต์ด้านล่าง ก่อนกดบันทึกแก้ไข/ลบ ครับ!"); btn.innerText = originalText; return; }
  await sendAdminPost(payload, btn, originalText);
}

async function sendAdminPost(payload, btn, originalText) {
  try {
    const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }); const result = await response.json();
    if(result.success) { 
        alert("✅ สำเร็จ!"); 
        await loadData(); 
        clearAdminForm();
    } else alert("❌ Error: " + result.error);
  } catch(err) { alert("❌ ตัดการเชื่อมต่อ"); }
  btn.innerText = originalText;
}

window.onload = loadData;
</script>
