<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer_Shop</title>
<style>
/* ==============================================================
   โซนที่ 1: CSS ตกแต่งหน้าเว็บ (สามารถปรับสี ฟอนต์ ขนาด ได้ที่นี่)
   ============================================================== */

/* ================== นำเข้าฟอนต์ Lowell ================== */
@font-face {
    font-family: 'LowellCustom';
    src: url('Lowell.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

/* ================== โครงสร้างหลัก ================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --primary: #3B96F5; --secondary: #FF4B7E; --bg-main: #0A1D3A; --bg-card: #E1E8EE; --border-color: #C49646; --text-muted: #555; }
body { font-family: 'LowellCustom', sans-serif; background: var(--bg-main); color: #fff; overflow-x: hidden; padding-bottom: 110px; min-height: 100vh; }
.floating-emojis { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.emoji { position: absolute; font-size: 24px; opacity: 0.3; animation: floatUp 10s linear infinite; }
@keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0.5; } 100% { transform: translateY(-100px) rotate(360deg); opacity: 0; } }

/* ================== ส่วน Header (โลโก้ และ ข้อมูลร้าน) ================== */
.header { text-align: center; padding: 30px 15px 20px; position: relative; z-index: 10; background: linear-gradient(180deg, rgba(10,29,58,0.9) 0%, rgba(10,29,58,0) 100%); }
.logo-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 0 20px rgba(59,150,245,0.5); object-fit: cover; background: #fff; margin-bottom: 10px; }
.shop-name { font-size: 28px; font-weight: bold; font-family: 'LowellCustom', sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 5px; }

/* ================== 🌟 ปุ่มกลับหน้าหลัก (มุมขวาบน) ================== */
.back-home-btn {
    position: absolute;
    top: 20px;       /* ระยะห่างจากด้านบน */
    right: 15px;     /* ระยะห่างจากขอบขวา */
    background: #fff;
    color: #000;
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    z-index: 50;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    font-family: inherit;
    transition: 0.2s;
}
.back-home-btn:active { transform: scale(0.95); }

/* ================== สถานะร้าน เปิด/ปิด ================== */
.shop-status-container { display: inline-flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); padding: 8px 20px; border-radius: 30px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
.shop-status-container.closed { border-color: rgba(255, 75, 126, 0.3); }
.status-indicator { width: 12px; height: 12px; border-radius: 50%; background-color: #4CAF50; margin-right: 10px; box-shadow: 0 0 10px #4CAF50, 0 0 20px #4CAF50; animation: pulse-green 1.5s infinite alternate; }
.status-indicator.closed { background-color: #FF4B7E; box-shadow: 0 0 10px #FF4B7E, 0 0 20px #FF4B7E; animation: pulse-red 1.5s infinite alternate; }
@keyframes pulse-green { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.2); opacity: 1; } }
@keyframes pulse-red { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.2); opacity: 1; } }
.status-text { font-size: 16px; font-weight: 600; color: #4CAF50; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.status-text.closed { color: #FF4B7E; }

/* ================== ส่วนจัดการปุ่มแท็บหมวดหมู่ (Tab Menu) ================== */
.tabs { display: flex; overflow-x: auto; white-space: nowrap; padding: 15px; background: var(--bg-main); position: sticky; top: 0px; z-index: 90; gap: 10px; border-bottom: 2px solid rgba(255,255,255,0.1); }
.tabs::-webkit-scrollbar { display: none; }
.tab { 
    padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
    border-radius: 20px; color: #fff; cursor: pointer; transition: 0.3s; 
    font-size: 18px; /* 👈 แก้ไขขนาดตัวหนังสือของแท็บหมวดหมู่ตรงนี้ */
    font-family: 'LowellCustom', sans-serif;
    white-space: nowrap;
}
.tab.active { background: linear-gradient(45deg, var(--primary), var(--secondary)); border-color: transparent; font-weight: bold; transform: scale(1.05); box-shadow: 0 4px 10px rgba(255,75,126,0.3); }

/* ================== 🌟 CSS สำหรับป้าย NEW กระพริบ ================== */
.blink-new {
    color: #FFEB3B; /* สีตัวหนังสือเหลือง */
    font-weight: bold;
    font-size: 14px;
    margin-left: 6px;
    text-shadow: 0 0 8px #FF4B7E; /* เรืองแสงสีชมพู/แดง */
    animation: blinker 0.8s linear infinite;
}
@keyframes blinker {
    50% { opacity: 0; }
}

/* ================== รูปแบบสินค้าหมวด: แอพพรีเมี่ยม และ เติมเกม ================== */
.container { padding: 15px; position: relative; z-index: 10; display: none; }
.container.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.category-group { margin-bottom: 25px; background: rgba(255,255,255,0.03); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
.category-title { font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid rgba(59,150,245,0.3); padding-bottom: 8px; }
.category-title img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
.sub-category-title { font-size: 16px; font-weight: 600; color: #fff; margin: 10px 0; padding-left: 10px; border-left: 3px solid var(--secondary); }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.card { background: #fff; border-radius: 15px; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
.card.selected { outline: 3px solid var(--primary); transform: scale(0.98); }
.card-icon { width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; }
.card-info { padding: 10px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
.card-name { font-size: 14px; color: #333; font-weight: 600; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.2; }
.price-tag { font-size: 16px; font-weight: bold; color: var(--secondary); background: rgba(255,75,126,0.1); padding: 4px 8px; border-radius: 8px; display: inline-block; }
.btn-select { margin-top: 8px; background: #f0f0f0; color: #333; border: none; padding: 6px; border-radius: 8px; font-size: 12px; font-weight: bold; width: 100%; transition: 0.2s; }
.card.selected .btn-select { background: var(--primary); color: #fff; }
.admin-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; z-index: 20; }
.admin-actions button { background: rgba(0,0,0,0.7); color: white; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.admin-actions button.edit { background: #FFC107; color: #000; }
.admin-actions button.delete { background: #F44336; }

/* ================== รูปแบบสินค้าหมวด: IOS-ANDROID ================== */
.ia-group { margin-bottom: 25px; }
.ia-group-title { font-size: 18px; font-weight: bold; color: var(--secondary); margin-bottom: 12px; padding-bottom: 5px; border-bottom: 1px dashed rgba(255,75,126,0.5); }
.ia-grid { display: flex; flex-direction: column; gap: 10px; }
.ia-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 15px; position: relative; }
.ia-icon-container { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
.ia-icon { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; }
.ia-card .admin-actions { top: -5px; right: -5px; }
.ia-info { flex-grow: 1; }
.ia-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; display: flex; align-items: center;}
.ia-desc { font-size: 12px; color: #aaa; margin-bottom: 8px; line-height: 1.3; }
.ia-os-badge { position: absolute; top: -10px; left: -10px; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 5; }
.ia-os-badge.ios { background: #000; color: #fff; border: 1px solid #555; }
.ia-os-badge.android { background: #3DDC84; color: #000; }
.ia-action { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 80px; }
.ia-price { font-size: 16px; font-weight: bold; color: var(--secondary); }
.os-selector { background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--primary); padding: 5px; border-radius: 6px; font-size: 12px; width: 100%; outline: none; }
.ia-btn { background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }
.ia-btn.selected { background: #4CAF50; }

/* ================== ส่วนตะกร้าสินค้าด้านล่าง (Cart Footer) ================== */
.cart-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10,29,58,0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
.cart-info { flex-grow: 1; }
.cart-total-text { font-size: 14px; color: #aaa; }
.cart-total-price { font-size: 24px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
.btn-checkout { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 12px 25px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,75,126,0.4); animation: pulse 2s infinite; display: flex; align-items: center; gap: 8px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,75,126,0.7); } 70% { box-shadow: 0 0 0 10px rgba(255,75,126,0); } 100% { box-shadow: 0 0 0 0 rgba(255,75,126,0); } }

/* ================== Modal (หน้าต่างป็อปอัพ) ================== */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; }
.modal-overlay.active { display: flex; opacity: 1; }
.modal-content { background: var(--bg-main); border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; border-radius: 20px; padding: 20px; position: relative; max-height: 85vh; overflow-y: auto; transform: scale(0.9); transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.modal-overlay.active .modal-content { transform: scale(1); }
.modal-close { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

/* ================== ส่วนตะกร้าใน Modal ================== */
.cart-items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; max-height: 50vh; overflow-y: auto; padding-right: 5px; }
.cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; }
.cart-item-info { flex-grow: 1; }
.cart-item-name { font-size: 14px; font-weight: bold; color: #fff; }
.cart-item-desc { font-size: 12px; color: #aaa; }
.cart-item-price { font-weight: bold; color: var(--secondary); margin: 0 10px; }
.btn-remove { background: rgba(244,67,54,0.2); color: #F44336; border: 1px solid #F44336; padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.checkout-summary { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
.summary-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: var(--secondary); margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); }
.btn-confirm { background: #4CAF50; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }

/* ================== หน้าแอดมิน (Admin Modal) ================== */
.admin-input { width: 100%; padding: 10px; margin-bottom: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; font-family: inherit; }
.admin-input::placeholder { color: #888; }
.btn-admin-save { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
.btn-admin-clear { background: #555; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
.admin-trigger { position: fixed; bottom: 20px; left: 20px; width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; z-index: 1000; }
.admin-tab-select { width: 100%; padding: 10px; margin-bottom: 15px; background: #fff; color: #000; border-radius: 8px; font-weight: bold; }
</style>
</head>
<body>

<div class="floating-emojis" id="emojiContainer"></div>

<div class="header">
    <button class="back-home-btn" onclick="window.location.href='#'">⬅️ กลับหน้าหลัก</button>

    <img src="https://sv1.picz.in.th/images/2025/02/16/F2TfSut.jpeg" alt="Logo" class="logo-img" id="storeLogo">
    <div class="shop-name" id="storeName">Wanderer Shop</div>
    <div style="font-size: 14px; color: #aaa; margin-bottom: 5px;">บริการจำหน่ายแอพพรีเมี่ยมและเติมเกม</div>
    
    <div class="shop-status-container">
        <div class="status-indicator"></div>
        <div class="status-text">สถานะ: เปิดให้บริการ</div>
    </div>
</div>

<div class="tabs" id="tabContainer"></div>
<div id="contentContainer"></div>

<div class="cart-footer">
    <div class="cart-info">
        <div class="cart-total-text">ราคารวม (0 ชิ้น)</div>
        <div class="cart-total-price" id="cartTotal">0 บาท</div>
    </div>
    <button class="btn-checkout" onclick="openCheckoutModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        สั่งซื้อสินค้า
    </button>
</div>

<div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeCheckoutModal()">×</button>
        <div class="modal-title">🛒 ตะกร้าสินค้าของคุณ</div>
        <div class="cart-items" id="cartItemsList"></div>
        <div class="checkout-summary">
            <div class="summary-total">
                <span>ยอดชำระสุทธิ</span>
                <span id="modalTotal">0 บาท</span>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; width: 100%; margin-top: 15px;">
            <button onclick="clearCart()" style="flex: 1; background: #6c757d; color: white; border: none; padding: 12px; border-radius: 10px; font-family: inherit; font-weight: 600; cursor: pointer;">
                🗑️ ล้างตะกร้า
            </button>
            <button class="btn-confirm" onclick="confirmCheckout()" style="flex: 2; margin-top: 0;">
                ✅ สั่งซื้อผ่าน LINE
            </button>
        </div>

    </div>
</div>

<button class="admin-trigger" ondblclick="openAdmin()"></button>

<div class="modal-overlay" id="adminModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeAdmin()">×</button>
        <div class="modal-title" id="adminTitle">⚙️ จัดการสินค้า</div>
        
        <select class="admin-tab-select" id="adminTabSelect" onchange="switchAdminTab()">
            <option value="แอพพรีเมี่ยม">แอพพรีเมี่ยม</option>
            <option value="เติมเกม">เติมเกม</option>
            <option value="เติมเหรียญนิยาย">เติมเหรียญนิยาย</option>
            <option value="IOS-ANDROID">แอพ-เกม iOS/Android</option>
        </select>

        <div id="adminForm-ia" style="display:none;">
            <input type="text" id="ia_cat" class="admin-input" placeholder="หมวดหมู่หลัก (เช่น เกมฮิต, แอพแนะนำ)"><br>
            <input type="text" id="ia_name" class="admin-input" placeholder="ชื่อแอพ/เกม (เช่น Minecraft)"><br>
            <input type="text" id="ia_desc" class="admin-input" placeholder="คำอธิบาย (ถ้ามี)"><br>

            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <input type="checkbox" id="ia_isNew" style="width: 18px; height: 18px; accent-color: var(--primary);"> 
                🌟 แปะป้าย NEW (ข้อความกระพริบ)
            </label>
            
            <select id="ia_group" class="admin-input" style="background:#fff; color:#000;">
                <option value="IOS">แอป/เกม ของระบบ iOS</option>
                <option value="ANDROID">แอป/เกม ของระบบ ANDROID</option>
                <option value="BOTH">รองรับทั้ง iOS และ ANDROID</option>
            </select><br>
            <input type="number" id="ia_price" class="admin-input" placeholder="ราคา (บาท)"><br>
            <input type="text" id="ia_icon" class="admin-input" placeholder="URL รูปภาพไอคอน"><br>
        </div>

        <div id="adminForm-pg">
            <input type="text" id="pg_cat" class="admin-input" placeholder="หมวดหมู่หลัก (เช่น ดูหนัง, ฟังเพลง)"><br>
            <input type="text" id="pg_appDesc" class="admin-input" placeholder="ชื่อแอพ (เช่น Netflix)"><br>
            <input type="text" id="pg_subCat" class="admin-input" placeholder="หมวดหมู่ย่อย (เช่น จอส่วนตัว, แชร์จอ)"><br>
            <input type="text" id="pg_name" class="admin-input" placeholder="แพ็กเกจ (เช่น 30 วัน)"><br>
            <input type="text" id="pg_desc" class="admin-input" placeholder="คำอธิบายเพิ่มเติม (ถ้ามี)"><br>
            <input type="number" id="pg_price" class="admin-input" placeholder="ราคา (บาท)"><br>
            <input type="text" id="pg_icon" class="admin-input" placeholder="URL รูปภาพไอคอน"><br>
        </div>

        <input type="hidden" id="admin_id">
        <button class="btn-admin-save" id="btnAdminSave" onclick="saveAdminPost('add')">เพิ่มสินค้าใหม่</button>
        <button class="btn-admin-save" id="btnAdminEdit" onclick="saveAdminPost('edit')" style="display:none; background:#FFC107; color:#000;">บันทึกการแก้ไข</button>
        <button class="btn-admin-clear" onclick="clearAdminForm()">ล้างข้อมูลฟอร์ม</button>
    </div>
</div>

<script>
// =========================================
// ตัวแปรตั้งค่า API และร้านค้า
// =========================================
const API_URL = "https://script.google.com/macros/s/AKfycbzhYklsTVGWE8_M2muqhJ-RobMXPBjsF8f78F9JsVA0priCMCoQx2OdLHk3GsmpGhHD/exec"; 
let productsData = [];
let cart = [];
let currentTab = "";
let storeInfo = {};

// ฟังก์ชันสร้าง Emoji ลอยเป็นพื้นหลัง
const emojis = ["✨","💎","🎮","📱","🎬","🎧","🚀","🎵"];
function createEmojis() {
    const container = document.getElementById('emojiContainer');
    for(let i=0; i<15; i++) {
        let el = document.createElement('div');
        el.className = 'emoji';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = (Math.random() * 10 + 10) + 's';
        el.style.animationDelay = (Math.random() * 5) + 's';
        container.appendChild(el);
    }
}
createEmojis();

// =========================================
// ระบบดึงข้อมูลและแสดงผล (Render)
// =========================================
async function loadData() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        productsData = data.products || [];
        storeInfo = data.storeInfo || {};
        
        if(storeInfo.name) document.getElementById('storeName').innerText = storeInfo.name;
        if(storeInfo.logo) document.getElementById('storeLogo').src = storeInfo.logo;

        // ดึงชื่อแท็บที่ไม่ซ้ำกัน
        let tabsSet = new Set();
        productsData.forEach(p => { if(p.tab) tabsSet.add(p.tab); });
        let tabs = Array.from(tabsSet);
        
        // บังคับให้ "แอพพรีเมี่ยม" ขึ้นก่อน ถ้าไม่มี ให้ใช้แท็บแรกสุด
        let defaultTab = tabs.includes("แอพพรีเมี่ยม") ? "แอพพรีเมี่ยม" : (tabs[0] || "แอพพรีเมี่ยม");
        if(!tabs.includes("แอพพรีเมี่ยม") && tabs.length === 0) tabs.push("แอพพรีเมี่ยม");

        renderTabs(tabs, defaultTab);
        switchTab(defaultTab);
        updateCartUI();
        checkShopStatus(); // เช็คเวลาเปิด-ปิดร้าน
    } catch (e) {
        console.error("Error loading data:", e);
    }
}

function renderTabs(tabs, defaultTab) {
    const container = document.getElementById('tabContainer');
    container.innerHTML = "";
    tabs.forEach(tab => {
        let btn = document.createElement('button');
        btn.className = `tab ${tab === defaultTab ? 'active' : ''}`;
        btn.innerText = tab;
        btn.onclick = () => switchTab(tab);
        container.appendChild(btn);
    });
}

function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab').forEach(el => {
        el.classList.toggle('active', el.innerText === tabName);
    });
    const container = document.getElementById('contentContainer');
    container.innerHTML = "";

    // คัดกรองสินค้าตามแท็บที่เลือก
    let filtered = productsData.filter(p => p.tab === tabName);
    
    // ตรวจสอบว่าแท็บนี้คือ IOS-ANDROID หรือไม่
    if(tabName === "IOS-ANDROID" || tabName === "แอพ-เกม iOS/Android") {
        renderIOSAndroid(filtered, container);
    } else {
        renderPremiumGame(filtered, container);
    }
}

// -----------------------------------------
// แสดงผลหมวด "แอพพรีเมี่ยม / เติมเกม"
// -----------------------------------------
function renderPremiumGame(filtered, container) {
    let wrap = document.createElement('div');
    wrap.className = 'container active';
    
    // จัดกลุ่มตาม หมวดหมู่หลัก (cat)
    let grouped = {};
    filtered.forEach(p => {
        let c = p.cat || "อื่นๆ";
        if(!grouped[c]) grouped[c] = [];
        grouped[c].push(p);
    });

    for (const [catName, items] of Object.entries(grouped)) {
        let catDiv = document.createElement('div');
        catDiv.className = 'category-group';
        
        // รูปไอคอนหมวดหมู่ (ใช้รูปแรกของกลุ่ม)
        let catIcon = items[0].icon || 'https://via.placeholder.com/30';
        catDiv.innerHTML = `<div class="category-title"><img src="${catIcon}" alt="icon">${catName}</div>`;

        // จัดกลุ่มย่อยตาม subCat
        let subGrouped = {};
        items.forEach(p => {
            let sc = p.subCat || "";
            if(!subGrouped[sc]) subGrouped[sc] = [];
            subGrouped[sc].push(p);
        });

        for (const [subCatName, subItems] of Object.entries(subGrouped)) {
            if(subCatName) {
                catDiv.innerHTML += `<div class="sub-category-title">${subCatName}</div>`;
            }
            let grid = document.createElement('div');
            grid.className = 'product-grid';

            subItems.forEach(item => {
                let adminBtns = "";
                if(isAdminMode) {
                    adminBtns = `
                    <div class="admin-actions">
                        <button class="edit" onclick="event.stopPropagation(); editProduct('${item.id}')">✎</button>
                        <button class="delete" onclick="event.stopPropagation(); deleteProduct('${item.id}')">🗑</button>
                    </div>`;
                }

                // เช็คว่าสินค้านี้อยู่ในตะกร้าไหม
                let inCart = cart.find(c => c.id === item.id);
                let card = document.createElement('div');
                card.className = `card ${inCart ? 'selected' : ''}`;
                card.onclick = () => toggleCart(item, card);
                
                card.innerHTML = `
                    ${adminBtns}
                    <img src="${item.icon || 'https://via.placeholder.com/150'}" class="card-icon" alt="icon">
                    <div class="card-info">
                        <div>
                            <div class="card-name">${item.appDesc ? item.appDesc + ' ' : ''}${item.name}</div>
                            ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
                        </div>
                        <div>
                            <div class="price-tag">${item.price} ฿</div>
                            <button class="btn-select">${inCart ? '✅ เลือกแล้ว' : '🛒 เลือกสินค้า'}</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            catDiv.appendChild(grid);
        }
        wrap.appendChild(catDiv);
    }
    container.appendChild(wrap);
}

function renderIOSAndroid(filtered, container) {
    let wrap = document.createElement('div');
    wrap.className = 'container active';
    
    // จัดกลุ่มตาม หมวดหมู่หลัก (cat)
    let grouped = {};
    filtered.forEach(p => {
        let c = p.cat || "อื่นๆ";
        if(!grouped[c]) grouped[c] = [];
        grouped[c].push(p);
    });

    for (const [catName, items] of Object.entries(grouped)) {
        let groupDiv = document.createElement('div');
        groupDiv.className = 'ia-group';
        groupDiv.innerHTML = `<div class="ia-group-title">${catName}</div>`;
        
        let grid = document.createElement('div');
        grid.className = 'ia-grid';

        items.forEach(item => {
            let adminBtns = "";
            if(isAdminMode) {
                adminBtns = `
                <div class="admin-actions">
                    <button class="edit" onclick="event.stopPropagation(); editProduct('${item.id}')">✎</button>
                    <button class="delete" onclick="event.stopPropagation(); deleteProduct('${item.id}')">🗑</button>
                </div>`;
            }

            let osOptions = "";
            let badge = "";
            // เช็คประเภท OS
            if(item.subCat === "IOS") {
                osOptions = `<option value="iOS">iOS</option>`;
                badge = `<div class="ia-os-badge ios">iOS</div>`;
            } else if(item.subCat === "ANDROID") {
                osOptions = `<option value="Android">Android</option>`;
                badge = `<div class="ia-os-badge android">Android</div>`;
            } else {
                osOptions = `<option value="iOS">iOS</option><option value="Android">Android</option>`;
                badge = `<div class="ia-os-badge ios" style="background:#primary;">iOS/Android</div>`;
            }

            // 🌟 เช็คว่ามีป้าย NEW ไหม
            let newBadge = item.isNew ? `<span class="blink-new">NEW</span>` : '';

            let inCart = cart.find(c => c.id === item.id);
            let card = document.createElement('div');
            card.className = 'ia-card';
            card.innerHTML = `
                ${badge}
                <div class="ia-icon-container">

                    <div class="ia-price">${item.price} ฿</div>

                        ${inCart ? '✅ ยกเลิก' : '🛒 เลือก'}
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
        groupDiv.appendChild(grid);
        wrap.appendChild(groupDiv);
    }
    container.appendChild(wrap);
}

// =========================================
// โซนจัดการตะกร้าสินค้า (Cart)
// =========================================
function toggleCart(item, cardElement) {
    const idx = cart.findIndex(c => c.id === item.id);
    if(idx > -1) { cart.splice(idx, 1); } 
    else { cart.push({...item}); }
    
    updateCartUI();
    // รีเฟรชหน้าเพื่ออัปเดตปุ่ม (แทนการจัดการ DOM ตรงๆ เพื่อลดบัค)
    switchTab(currentTab);
}

function toggleCartIA(event, itemId) {
    event.stopPropagation();
    const item = productsData.find(p => p.id === itemId);
    const idx = cart.findIndex(c => c.id === itemId);
    
    if(idx > -1) { 
        cart.splice(idx, 1); 
    } else { 
        let sel = document.getElementById(`os_${itemId}`);
        let selectedOs = sel ? sel.value : (item.subCat || "iOS");
        cart.push({...item, selectedOs: selectedOs}); 
    }
    
    updateCartUI();
    switchTab(currentTab);
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
    renderCartModal();
    switchTab(currentTab);
    
    // ถ้าตะกร้าว่าง ให้ปิดหน้าต่างอัตโนมัติ
    if(cart.length === 0) closeCheckoutModal();
}

function clearCart() {
    if (cart.length === 0) return;
    if (confirm('ต้องการล้างรายการทั้งหมดในตะกร้าใช่หรือไม่?')) {
        cart = [];
        updateCartUI();
        closeCheckoutModal();
        switchTab(currentTab); // รีเฟรชหน้าจอเพื่อลบไฮไลต์ที่เลือก
    }
}

function calculateTotal() {
    return cart.reduce((sum, item) => sum + Number(item.price), 0);
}

function updateCartUI() {
    const total = calculateTotal();
    document.querySelector('.cart-total-text').innerText = `ราคารวม (${cart.length} ชิ้น)`;
    document.getElementById('cartTotal').innerText = `${total} บาท`;
}

// =========================================
// โซน Modal และการสั่งซื้อ
// =========================================
function openCheckoutModal() {
    if(cart.length === 0) { alert("ยังไม่มีสินค้าในตะกร้า"); return; }
    renderCartModal();
    document.getElementById('checkoutModal').classList.add('active');
}
function closeCheckoutModal() {
    document.getElementById('checkoutModal').classList.remove('active');
}

function renderCartModal() {
    const list = document.getElementById('cartItemsList');
    list.innerHTML = "";
    cart.forEach((item, index) => {
        let nameShow = "";
        if(item.tab === "IOS-ANDROID" || item.tab === "แอพ-เกม iOS/Android") {
            nameShow = `${item.name} [${item.selectedOs}]`;
        } else {
            nameShow = `${item.appDesc || ''} ${item.name || ''}`;
        }
        
        let el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `
            <div class="cart-item-info">
                <div class="cart-item-name">${nameShow}</div>
                <div class="cart-item-desc">${item.cat || ''}</div>
            </div>
            <div class="cart-item-price">${item.price} ฿</div>
            <button class="btn-remove" onclick="removeFromCart(${index})">ลบ</button>
        `;
        list.appendChild(el);
    });
    document.getElementById('modalTotal').innerText = `${calculateTotal()} บาท`;
}

// 🚀 ฟังก์ชันสั่งซื้อ (รองรับการคละแท็บแบบ 100%)
function confirmCheckout() {
    if (cart.length === 0) return;
    let total = calculateTotal();
    let text = "🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n";
    
    let hasApp = false;
    let hasGame = false;
    let hasCoin = false;
    let hasOS = false;

    cart.forEach((item, index) => {
        let itemTab = item.tab;
        
        // จัดรูปแบบตามหมวดหมู่
        if (itemTab === "แอพพรีเมี่ยม") {
            hasApp = true;
            let title = [item.cat, item.appDesc].filter(Boolean).join(' ');
            let pkg = [item.subCat, item.name].filter(Boolean).join(' ');
            text += `${index + 1}. ชื่อแอพ : ${title}\n   แพ็กเกจ: ${pkg}\n   ราคา: ${item.price} บาท\n`;
        } 
        else if (itemTab === "IOS-ANDROID" || itemTab === "แอพ-เกม iOS/Android") {
            hasOS = true;
            let cleanName = (item.cat || item.name || '').replace(/\[iOS\]/i, '').replace(/\[Android\]/i, '').trim();
            text += `${index + 1}. ${cleanName} [${item.selectedOs || item.os || 'iOS'}]\n   ราคา: ${item.price} บาท\n`;
        } 
        else {
            if (itemTab === "เติมเกม") hasGame = true;
            if (itemTab === "เติมเหรียญนิยาย") hasCoin = true;
            
            let title = [item.cat, item.appDesc].filter(Boolean).join(' ');
            let pkg = [item.subCat, item.name].filter(Boolean).join(' ');
            text += `${index + 1}. ${title}\n   แพ็กเกจ: ${pkg}\n   ราคา: ${item.price} บาท\n`;
        }
    });

    text += `---------------------------\n💰 *ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\n`;

    // ตรวจสอบการคละแท็บ
    let typesCount = [hasApp, hasGame, hasCoin, hasOS].filter(Boolean).length;

    if (typesCount > 1) {
        text += `📌 *แจ้งไอดี/รหัส สำหรับรายการเติมเกม/เหรียญ*\nและรบกวนรอแอดมินตอบคอนเฟิร์มก่อนโอนนะคะ`;
    } else {
        if (hasApp) {
            text += `รบกวนรอแอดมินตอบก่อนค่อยโอนนะคะ`;
        } else if (hasGame) {
            text += `📌 *แจ้งไอดี ได้เลยค่ะ*`;
        } else if (hasCoin) {
            text += `📌 *แจ้งไอดี/รหัส ได้เลยค่ะ*`;
        } else if (hasOS) {
            text += `รบกวนรอแอดมินตอบก่อนนะคะ`;
        }
    }

    navigator.clipboard.writeText(text).then(() => { 
        alert("คัดลอกรายการสั่งซื้อแล้ว กำลังพาไปที่ LINE..."); 
        window.location.href = `https://line.me/R/ti/p/${storeInfo.line ? storeInfo.line.replace('@','%40') : ''}`; 
    }).catch(() => {
        alert("คัดลอกไม่สำเร็จ กำลังพาไปที่ LINE...");
        window.location.href = `https://line.me/R/ti/p/${storeInfo.line ? storeInfo.line.replace('@','%40') : ''}`;
    });
    closeCheckoutModal();
}

// โซนจัดการระบบแอดมิน (เพิ่ม/ลบ/แก้ไข)

let isAdminMode = false;

function openAdmin() {
    let pass = prompt("รหัสผ่านแอดมิน:");
    if(pass === "1234") { 
        isAdminMode = true; 
        switchTab(currentTab); // รีเฟรชให้ปุ่มแอดมินโผล่
        document.getElementById('adminModal').classList.add('active');
        clearAdminForm();
    } else if(pass !== null) {
        alert("รหัสผ่านผิด!");
    }
}
function closeAdmin() {
    document.getElementById('adminModal').classList.remove('active');
    isAdminMode = false;
    switchTab(currentTab);
}

function switchAdminTab() {
    let tab = document.getElementById('adminTabSelect').value;
    if(tab === 'IOS-ANDROID' || tab === 'แอพ-เกม iOS/Android') {
        document.getElementById('adminForm-ia').style.display = 'block';
        document.getElementById('adminForm-pg').style.display = 'none';
    } else {
        document.getElementById('adminForm-ia').style.display = 'none';
        document.getElementById('adminForm-pg').style.display = 'block';
    }
}

function editProduct(id) {
    let item = productsData.find(p => p.id === id);
    if(!item) return;

    document.getElementById('admin_id').value = item.id;
    
    if(item.tab === 'IOS-ANDROID' || item.tab === 'แอพ-เกม iOS/Android') {
        document.getElementById('adminTabSelect').value = 'IOS-ANDROID';
        switchAdminTab();
        document.getElementById('ia_cat').value = item.cat || '';
        document.getElementById('ia_name').value = item.name || '';
        document.getElementById('ia_desc').value = item.desc || '';
        document.getElementById('ia_group').value = item.subCat || '';
        document.getElementById('ia_price').value = item.price || 0;
        document.getElementById('ia_icon').value = item.icon || '';
        // 🚀 ดึงค่า Checkbox NEW
        if(document.getElementById('ia_isNew')) {
            document.getElementById('ia_isNew').checked = item.isNew === true || item.isNew === "TRUE" || item.isNew === true;
        }
    } else {
        document.getElementById('adminTabSelect').value = item.tab || 'แอพพรีเมี่ยม';
        switchAdminTab();
        document.getElementById('pg_cat').value = item.cat || '';
        document.getElementById('pg_appDesc').value = item.appDesc || '';
        document.getElementById('pg_subCat').value = item.subCat || '';
        document.getElementById('pg_name').value = item.name || '';
        document.getElementById('pg_desc').value = item.desc || '';
        document.getElementById('pg_price').value = item.price || 0;
        document.getElementById('pg_icon').value = item.icon || '';
    }

    document.getElementById('btnAdminSave').style.display = 'none';
    document.getElementById('btnAdminEdit').style.display = 'block';
    document.getElementById('adminTitle').innerText = "⚙️ แก้ไขสินค้า";
    
    document.getElementById('adminModal').classList.add('active');
}

function deleteProduct(id) {
    if(confirm("ยืนยันการลบสินค้านี้?")) {
        let btn = document.querySelector('.admin-trigger'); 
        sendAdminPost({ action: 'delete_product', id: id }, btn, "ลบ");
    }
}

function clearAdminForm() {
    document.getElementById('admin_id').value = '';
    
    // เคลียร์ฟอร์ม IOS-ANDROID
    document.getElementById('ia_cat').value = '';
    document.getElementById('ia_name').value = '';
    document.getElementById('ia_desc').value = '';

    document.getElementById('ia_price').value = '';
    document.getElementById('ia_icon').value = '';

    // เคลียร์ฟอร์ม ปกติ
    document.getElementById('pg_cat').value = '';
    document.getElementById('pg_appDesc').value = '';
    document.getElementById('pg_subCat').value = '';
    document.getElementById('pg_name').value = '';
    document.getElementById('pg_desc').value = '';
    document.getElementById('pg_price').value = '';
    document.getElementById('pg_icon').value = '';

    document.getElementById('btnAdminSave').style.display = 'block';
    document.getElementById('btnAdminEdit').style.display = 'none';
    document.getElementById('adminTitle').innerText = "⚙️ เพิ่มสินค้าใหม่";
}

async function saveAdminPost(actionType) {
    let btn = actionType === 'add' ? document.getElementById('btnAdminSave') : document.getElementById('btnAdminEdit');
    let originalText = btn.innerText;
    btn.innerText = "กำลังบันทึก...";

    let tab = document.getElementById('adminTabSelect').value;
    let payload = {
        action: actionType === 'add' ? 'add_product' : 'edit_product',
        id: document.getElementById('admin_id').value,
        tab: tab
    };

    if(tab === 'IOS-ANDROID' || tab === 'แอพ-เกม iOS/Android') {
        payload.cat = document.getElementById('ia_cat').value; 
        payload.name = document.getElementById('ia_name').value; 
        payload.desc = document.getElementById('ia_desc').value; 
        payload.subCat = document.getElementById('ia_group').value; 
        payload.price = Number(document.getElementById('ia_price').value) || 0; 
        payload.icon = document.getElementById('ia_icon').value; 
        // 🚀 เก็บค่า Checkbox NEW
        payload.isNew = document.getElementById('ia_isNew').checked;
    } else { 
        payload.cat = document.getElementById('pg_cat').value; 
        payload.appDesc = document.getElementById('pg_appDesc').value; 
        payload.subCat = document.getElementById('pg_subCat').value; 
        payload.name = document.getElementById('pg_name').value; 
        payload.desc = document.getElementById('pg_desc').value; 
        payload.price = Number(document.getElementById('pg_price').value) || 0; 
        payload.icon = document.getElementById('pg_icon').value; 
    } 

    if (actionType !== 'add' && !payload.id) { 
        alert("กรุณาเลือกสินค้าก่อน"); 
        btn.innerText = originalText; 
        return; 
    } 

    await sendAdminPost(payload, btn, originalText); 
}

async function sendAdminPost(payload, btn, originalText) { 
    try { 
        const response = await fetch(API_URL, { 
            method: "POST", 
            body: JSON.stringify(payload) 
        }); 
        const result = await response.json(); 
        if(result.success) { 
            alert("✅ สำเร็จ!"); 
            await loadData(); 
            if(payload.action === 'add_product' || payload.action === 'delete_product') clearAdminForm(); 
            document.getElementById('adminModal').classList.remove('active');
        } 
    } catch(err) { 
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); 
    } 
    if(btn) btn.innerText = originalText; 
}

window.onload = loadData;

function checkShopStatus() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    
    const timeInMinutes = (hours * 60) + minutes;
    const openTime = 630;  // 10:30
    const closeTime = 30;  // 00:30
    
    const isOpen = (timeInMinutes >= openTime || timeInMinutes < closeTime);

    const container = document.querySelector('.shop-status-container');
    const indicator = document.querySelector('.status-indicator');
    const text = document.querySelector('.status-text');

    if (isOpen) {
        container.classList.remove('closed');
        indicator.classList.remove('closed');
        text.classList.remove('closed');
        text.innerText = 'สถานะ: เปิดให้บริการ';
    } else {
        container.classList.add('closed');
        indicator.classList.add('closed');
        text.classList.add('closed');
        text.innerText = 'สถานะ: ปิดให้บริการชั่วคราว';
    }
}
setInterval(checkShopStatus, 60000); // อัปเดตสถานะร้านทุก 1 นาที
