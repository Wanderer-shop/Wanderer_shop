<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer_Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= CSS ธีมและสี ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { 
    --primary: #3B96F5; --secondary: #FF4B7E; --bg-main: #0A1D3A; 
    --bg-card: #E1E8EE; --border-color: #C49646; --text-muted: #666; 
}
body { font-family: 'Kanit', sans-serif; background: var(--bg-main); color: #fff; overflow-x: hidden; padding-bottom: 110px; }

/* เอฟเฟกต์พื้นหลัง */
.bg-glow-1 { position: fixed; top: -100px; left: -100px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(176,38,255,0.15) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
.bg-glow-2 { position: fixed; bottom: 20%; right: -150px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,210,255,0.1) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
#pts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.pt { position: absolute; animation: ptUp linear infinite; opacity: 0; }
@keyframes ptUp { 0% { transform: translateY(105vh); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

/* ป้ายสถานะร้าน */
.status { padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 11px; text-transform: uppercase; animation: pulse 1.5s infinite; box-shadow: 0 0 10px rgba(0,0,0,0.3); display: inline-block; }
.status.open { background: #00c853; color:#fff; } .status.closed { background: #ff1744; color:#fff; } .status.slow { background: #fbc02d; color:#000; } .status.pause { background: #f57c00; color:#fff; }
@keyframes pulse { 0% { transform: scale(1); opacity:1;} 50% { transform: scale(1.05); opacity:0.8;} 100% { transform: scale(1); opacity:1;} }

/* Hero Section */
.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(135deg, rgba(10,29,58,0.9) 0%, rgba(59,150,245,0.2) 100%); padding: 60px 20px 30px; text-align: center; border-bottom: 2px solid var(--border-color); position: relative; z-index: 2; margin-bottom: 25px; }
.hero-logo-frame { width: 180px; height: 180px; background: var(--bg-card); border: 4px solid var(--border-color); border-radius: 50%; overflow: hidden; box-shadow: 0 0 20px rgba(59,150,245,0.3); }
.hero-logo-img { width: 100%; height: 100%; object-fit: cover; }
.hero-glowing-title { font-family: 'Mitr', sans-serif; font-size: 28px; font-weight: 700; color: #fff; text-shadow: 0 0 10px var(--primary); margin-top: 5px; cursor: pointer; user-select: none; }
.hero-welcome { font-size: 14px; color: #ddd; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--primary); }

/* แท็บเมนู */
.tab-nav { display: flex; overflow-x: auto; gap: 10px; padding: 0 20px 15px; justify-content: center; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.1); margin-top: -10px; margin-bottom: 15px; }.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid var(--border-color); padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; }
.tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-color: transparent; }

/* พื้นที่คอนเทนต์หลัก (หัวข้อ & สินค้า) */
.content { max-width: 600px; margin: 0 auto; padding: 0 20px; }
.content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.content-title { font-size: 16px; font-weight: bold; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
.sort-select { background: var(--bg-card); color: #000; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-family: inherit; font-weight: bold; outline: none; }
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }

/* การ์ดสินค้า */
.app-card { background: var(--bg-card); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; color: #000; position: relative; border: 2px solid transparent; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
.app-card.selected { border-color: #9c27b0; background: #f3e5f5; }
.app-card.selected::before { content: '✓'; position: absolute; top: -5px; left: -5px; background: #9c27b0; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; z-index: 10; border: 2px solid #fff; }
.app-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 3px 6px; border-radius: 8px; color: #fff; font-weight: bold; z-index: 5; }
.badge-ready { background: #00c853; } .badge-notready { background: #ff1744; }
.app-card img { width: 70px; height: 70px; border-radius: 15px; object-fit: cover; margin-bottom: 8px; }
.app-name { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-bottom: 5px; color:#0A1D3A; }
.app-desc { font-size: 11px; color: #666; margin-bottom: 8px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* OS Card เฉพาะ */
.os-card { width: 160px; min-height: 175px; margin: 0 auto; }
.os-buttons { display: flex; gap: 5px; width: 100%; margin-top: auto; }
.os-btn { flex: 1; padding: 5px; font-size: 11px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
.os-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.price-tag { font-weight: bold; color: var(--secondary); font-size: 14px; margin-top: auto; }

/* ระบบสไลเดอร์หน้าข้อมูลร้าน */
.store-media-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; min-height: 200px; }
.store-slide { width: 100%; max-height: 250px; object-fit: cover; display: none; }
.store-slide.active { display: block; }
.store-slide-iframe { width: 100%; height: 250px; display: none; border: none; }
.store-slide-iframe.active { display: block; }
.slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
.slider-btn:hover { background: var(--primary); }
.slider-btn.prev { left: 10px; }
.slider-btn.next { right: 10px; }
.slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
.slider-dot { width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: 0.3s; }
.slider-dot.active { background: var(--primary); transform: scale(1.2); }

/* ตะกร้าสินค้า */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 29, 58, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--primary); padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; transform: translateY(100%); transition: 0.3s; z-index: 1000; }
.bottom-bar.active { transform: translateY(0); }
.cart-header-box { background: rgba(59,150,245,0.2); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10001; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: #fff; color: #000; border-radius: 16px; width: 100%; max-width: 450px; max-height: 85vh; overflow-y: auto; position:relative; }
.modal-header-color { background:#9c27b0; color:#fff; padding:15px; border-radius: 16px 16px 0 0; text-align:center; font-weight:bold; position:sticky; top:0; z-index:10; }
.modal-body { padding:20px; }
.btn-main { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size:16px; }
.btn-action { background: var(--primary); color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-size:14px; width:100%; margin-bottom:10px; }
.btn-delete { background: #ff1744; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-size:14px; }
.btn-close { background: #eee; color: #333; border: none; padding: 10px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 5px; font-weight:bold; }

/* Admin Panel UI */
.admin-top-nav { display:flex; gap:10px; margin-bottom:15px; border-bottom:2px solid #eee; padding-bottom:10px; }
.admin-top-tab { flex:1; padding:10px; text-align:center; background:#f5f5f5; border-radius:8px; cursor:pointer; font-weight:bold; color:#555; }
.admin-top-tab.active { background:var(--primary); color:#fff; }
.admin-input, .admin-textarea, .admin-select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font-family:inherit; font-size:14px; background:#fafafa; }
.admin-textarea { min-height: 80px; resize:vertical; }
.admin-label { font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 4px; display: block; }
.checkbox-group { display: flex; gap: 15px; margin-bottom: 12px; }
.product-list-card { border:1px solid #eee; background:#fafafa; border-radius:8px; padding:10px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
.product-list-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #ddd; padding-bottom:5px; }

/* ปุ่มลอยแอดมิน */
.admin-icon { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; background: #CDB4DB; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; border: 2px solid #fff; }
</style>
</head>
<body>

<div class="bg-glow-1"></div><div class="bg-glow-2"></div><div id="pts"></div>

<div class="hero">
  <div style="position:absolute; top:15px; left:15px;">
    <div id="shopStatusPill" class="status open">OPEN</div>
  </div>
  <div class="hero-logo-frame"><img src="https://via.placeholder.com/180" id="shopLogo" class="hero-logo-img"></div>
  <div class="hero-glowing-title" id="shopTitleHeader">Wanderer_Shop</div>
  <div class="hero-welcome" id="welcomeMsg">ยินดีต้อนรับสู่ร้าน Wanderer_Shop รับอะไรดีคะ</div>
</div>

<div class="tab-nav" id="tabNavigation"></div>

<div class="content">
  
  <div class="content-header" id="productGridHeader">
    <div class="content-title">รายการสินค้า</div>
    <select class="sort-select" id="sortSelect" onchange="renderProducts()">
      <option value="name">เรียงตามอักษร</option>
      <option value="price_asc">ราคา (น้อยไปมาก)</option>
      <option value="price_desc">ราคา (มากไปน้อย)</option>
    </select>
  </div>

  <div id="main-content" class="app-grid">
    <div style="text-align:center; grid-column:1/-1; padding:40px;">กำลังโหลดข้อมูลจากฐานข้อมูล...</div>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="cart-header-box" onclick="toggleCheckoutModal()">
    <div style="font-size:12px; font-weight:bold; color:var(--primary);">🛒 ดูรายการที่เลือก</div>
    <div style="font-size:11px; color:#fff;" id="cartCountText">0 รายการ | 0฿</div>
  </div>
  <button class="btn-main" style="width:auto; padding:10px 30px;" onclick="processCheckout()">สั่งซื้อสินค้า</button>
</div>

<div id="checkoutModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header-color">🛒 รายการสั่งซื้อ (Wanderer Shop)</div>
    <div class="modal-body">
        <textarea id="checkoutTextarea" style="width:100%; height:200px; padding:10px; font-family:inherit; border-radius:8px; border:1px solid #ccc; margin-bottom:10px;" readonly></textarea>
        <button class="btn-main" id="confirmOrderBtn" onclick="confirmOrder()" style="background:#00c853;">คัดลอกข้อความและทักไลน์</button>
        <button class="btn-close" onclick="closeModal('checkoutModal')">ยกเลิก</button>
    </div>
  </div>
</div>

<div id="adminLoginModal" class="modal-overlay">
  <div class="modal-box" style="text-align:center; padding:20px; border-radius:16px;">
    <h3>🔒 เข้าสู่ระบบแอดมิน</h3>
    <input type="password" id="adminPwd" class="admin-input" style="margin-top:15px; text-align:center;" placeholder="ใส่รหัสผ่าน">
    <button class="btn-main" onclick="verifyAdmin()">ยืนยัน</button>
    <button class="btn-close" onclick="closeModal('adminLoginModal')">ยกเลิก</button>
  </div>
</div>

<div id="adminDashboard" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header-color" style="background:#0A1D3A;">⚙️ โหมดผู้ดูแลระบบ</div>
    <div class="modal-body">
        <div class="admin-top-nav">
            <div class="admin-top-tab active" id="tabShopSet" onclick="switchAdminMain('shop')">🏪 ข้อมูลร้านค้า</div>
            <div class="admin-top-tab" id="tabProdSet" onclick="switchAdminMain('product')">📦 หมวดหมู่สินค้า</div>
        </div>
        
        <div id="adminContentArea"></div>
        
        <button class="btn-close" style="margin-top:20px;" onclick="closeModal('adminDashboard')">ปิดหน้าต่าง</button>
    </div>
  </div>
</div>

<div class="admin-icon" id="adminFloatBtn" onclick="openAdminDashboard()">+</div>

<script>
// ================= การตั้งค่าพื้นฐาน =================
const API_URL = "https://script.google.com/macros/s/AKfycbxSgNZkAvnU5bw33tu9RM2AZOCpgrvASdU_nZVbdjzJ8__5DZFGLn0NEmP24o9aXvnF/exec"; // ⚠️ ตรวจสอบ URL อีกครั้ง

let storeData = { status: 'open', welcome: '', line: '', logo: '', mediaLink: '', hours: '', warranty: '' };
let products = [];
let allTabs = [];
let cart = [];
let currentTab = "";
let editingProductId = null;
let currentStoreMediaIdx = 0; // สำหรับระบบสไลเดอร์หน้าข้อมูลร้าน

// ================= ระบบตกแต่ง =================
const P = document.getElementById('pts');
['🎐','🍃','🌌'].forEach(e => {
  for (let j = 0; j < 6; j++) {
    const d = document.createElement('div');
    d.className = 'pt'; d.textContent = e;
    d.style.cssText = `left:${Math.random()*100}vw; font-size:${12+Math.random()*15}px; animation-duration:${10+Math.random()*15}s; animation-delay:${-Math.random()*20}s;`;
    P.appendChild(d);
  }
});

// ================= ระบบดึงข้อมูล =================
async function initApp() {
    try {
        const response = await fetch(`${API_URL}?t=${Date.now()}`, { method: 'POST', body: JSON.stringify({ action: "get_data" }) });
        const data = await response.json();
        if (data) {
            products = data.products || [];
            if(data.storeInfo) storeData = { ...storeData, ...data.storeInfo };
            allTabs = data.tabs || [];
            applyStoreInfo();
            renderTabs();
        }
    } catch(err) {
        document.getElementById('main-content').innerHTML = `<p style="color:red; text-align:center;">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้าจอ</p>`;
    }
}

function applyStoreInfo() {
    const stTop = document.getElementById('shopStatusPill');
    stTop.className = `status ${storeData.status.toLowerCase()}`;
    const statusMap = { 'open':'OPEN', 'closed':'CLOSED', 'slow':'SLOW', 'pause':'PAUSE' };
    stTop.innerText = statusMap[storeData.status] || 'OPEN';

    document.getElementById('welcomeMsg').innerText = storeData.welcome || "ยินดีต้อนรับสู่ร้าน Wanderer_Shop รับอะไรดีคะ";
    if(storeData.logo) document.getElementById('shopLogo').src = storeData.logo;
}

// ================= ระบบแท็บ & แสดงสินค้า =================
function renderTabs() {
    const nav = document.getElementById('tabNavigation');
    let baseTabs = ["ข้อมูลร้าน", "แอพพรีเมี่ยม", "เติมเกม", "แอพ-เกม iOS/Android"];
    let combinedTabs = [...new Set([...baseTabs, ...allTabs])];
    
    if(!currentTab) currentTab = combinedTabs[0];
    
    nav.innerHTML = combinedTabs.map(t => `<button class="tab-btn ${t === currentTab ? 'active' : ''}" onclick="switchTab('${t}')">${t}</button>`).join('');
    renderProducts();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText === tab));
    renderProducts();
}

// ฟังก์ชันเลื่อนภาพในสไลเดอร์หน้าข้อมูลร้าน
function changeStoreMedia(dir, max) {
    // ปิดรูปเดิม
    document.getElementById('s_media_' + currentStoreMediaIdx).classList.remove('active');
    if(document.getElementById('s_dot_' + currentStoreMediaIdx)) {
        document.getElementById('s_dot_' + currentStoreMediaIdx).classList.remove('active');
    }
    
    // เปลี่ยน index
    currentStoreMediaIdx += dir;
    if(currentStoreMediaIdx >= max) currentStoreMediaIdx = 0;
    if(currentStoreMediaIdx < 0) currentStoreMediaIdx = max - 1;
    
    // โชว์รูปใหม่
    document.getElementById('s_media_' + currentStoreMediaIdx).classList.add('active');
    if(document.getElementById('s_dot_' + currentStoreMediaIdx)) {
        document.getElementById('s_dot_' + currentStoreMediaIdx).classList.add('active');
    }
}

function renderProducts() {
    const content = document.getElementById('main-content');
    const header = document.getElementById('productGridHeader');
    
    // --- โหมดหน้า "ข้อมูลร้าน" ---
    if(currentTab === "ข้อมูลร้าน") {
        header.style.display = 'none'; // ซ่อนส่วนจัดเรียงเมื่ออยู่หน้าติดต่อร้าน
        content.style.display = 'block'; // ถอด grid ออก
        
        let sliderHtml = '';
        if(storeData.mediaLink) {
            // แยกบรรทัดหรือลูกน้ำ เพื่อเอาลิงก์หลายอัน
            let links = storeData.mediaLink.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
            if(links.length > 0) {
                currentStoreMediaIdx = 0;
                sliderHtml = `<div class="store-media-container">`;
                
                links.forEach((link, idx) => {
                    let isActive = idx === 0 ? 'active' : '';
                    let isVid = link.includes('youtube.com') || link.includes('youtu.be');
                    if(isVid) {
                        sliderHtml += `<iframe class="store-slide-iframe ${isActive}" id="s_media_${idx}" src="${link}" frameborder="0" allowfullscreen></iframe>`;
                    } else {
                        sliderHtml += `<img class="store-slide ${isActive}" id="s_media_${idx}" src="${link}">`;
                    }
                });

                if(links.length > 1) {
                    sliderHtml += `<button class="slider-btn prev" onclick="changeStoreMedia(-1, ${links.length})">❮</button>`;
                    sliderHtml += `<button class="slider-btn next" onclick="changeStoreMedia(1, ${links.length})">❯</button>`;
                    sliderHtml += `<div class="slider-dots">` + links.map((_, i) => `<div class="slider-dot ${i===0?'active':''}" id="s_dot_${i}"></div>`).join('') + `</div>`;
                }
                sliderHtml += `</div>`;
            }
        }

        content.innerHTML = `
            <div style="background:var(--bg-card); color:#000; padding:20px; border-radius:15px; text-align:center;">
                ${sliderHtml}
                <h3 style="color:var(--primary); margin-bottom:10px;">ช่องทางการติดต่อ</h3>
                <p>LINE OA: <strong>${storeData.line}</strong> <button onclick="navigator.clipboard.writeText('${storeData.line}')" style="padding:4px 10px; font-size:12px; border-radius:8px; border:none; background:var(--primary); color:white; cursor:pointer; margin-left:5px;">คัดลอก</button></p>
                <p style="margin-top:10px;">เวลาทำการ: ${storeData.hours || '-'}</p>
                <p style="margin-top:10px; font-size:12px; color:#555;">${storeData.warranty || ''}</p>
            </div>`;
        return;
    }

    // --- โหมดหน้า "สินค้าอื่นๆ" ---
    header.style.display = 'flex'; // แสดงส่วนจัดเรียง
    content.style.display = 'grid'; // คืนค่า grid

    let filtered = products.filter(p => p.tab === currentTab);
    const sortVal = document.getElementById('sortSelect').value;
    
    // ตั้งชื่อที่จะใช้โชว์และจัดเรียง
    filtered.forEach(p => { p.displayName = p.cat || p.name || 'ไม่มีชื่อ'; });

    if(sortVal === 'name') filtered.sort((a,b) => a.displayName.localeCompare(b.displayName));
    if(sortVal === 'price_asc') filtered.sort((a,b) => Number(a.price) - Number(b.price));
    if(sortVal === 'price_desc') filtered.sort((a,b) => Number(b.price) - Number(a.price));

    if(filtered.length === 0) {
        content.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#fff;">ไม่มีสินค้าในหมวดนี้</div>`;
        return;
    }

    const isIOSTab = currentTab === "แอพ-เกม iOS/Android" || currentTab === "แอพ/เกม IOS-ANDROID";

    content.innerHTML = filtered.map(p => {
        const inCart = cart.find(c => c.id === p.id);
        const cardClass = isIOSTab ? "app-card os-card" : "app-card";
        
        // เช็คสถานะสินค้า
        let isReady = false;
        if(isIOSTab) isReady = p.status === 'ready' || p.status === 'พร้อมส่ง';
        else isReady = !p.status || p.status === 'ready' || p.status === 'พร้อมส่ง';
        
        const badge = isReady ? `<div class="app-badge badge-ready">พร้อมส่ง</div>` : `<div class="app-badge badge-notready">เมลไม่พร้อม</div>`;
        
        let osButtons = '';
        if(isIOSTab) {
            const selectedOS = inCart ? inCart.os : '';
            const availableOS = p.os ? p.os.split(',') : ['iOS','Android']; 
            osButtons = `<div class="os-buttons">`;
            if(availableOS.includes('iOS')) osButtons += `<button class="os-btn ${selectedOS === 'iOS' ? 'active' : ''}" onclick="event.stopPropagation(); toggleCart('${p.id}', 'iOS')">iOS</button>`;
            if(availableOS.includes('Android')) osButtons += `<button class="os-btn ${selectedOS === 'Android' ? 'active' : ''}" onclick="event.stopPropagation(); toggleCart('${p.id}', 'Android')">Android</button>`;
            osButtons += `</div>`;
        }

        const appTitle = isIOSTab ? p.name : p.cat;
        let appSubTitle = '';
        if(isIOSTab) {
            appSubTitle = p.desc || '';
        } else {
            const pkgName = p.name ? `[${p.name}] ` : '';
            appSubTitle = pkgName + (p.appDesc || p.desc || '');
        }

        let priceButton = isIOSTab ? `<div class="price-tag">${p.price}฿</div>` : `<button class="btn-main" style="font-size:12px; margin-top:5px; padding:6px 15px;" onclick="event.stopPropagation(); toggleCart('${p.id}', null)">${p.price}฿</button>`;

        return `
            <div class="${cardClass} ${inCart ? 'selected' : ''}" onclick="toggleCart('${p.id}', null)">
                ${badge}
                <img src="${p.icon || 'https://via.placeholder.com/70'}" onerror="this.src='https://via.placeholder.com/70'">
                <div class="app-name">${appTitle}</div>
                <div class="app-desc">${appSubTitle}</div>
                ${priceButton}
                ${osButtons}
            </div>
        `;
    }).join('');
}

// ================= ระบบตะกร้า & บิลสั่งซื้อ =================
function toggleCart(id, osForce) {
    if(currentTab === "ข้อมูลร้าน") return;
    const product = products.find(p => p.id === id);
    if(!product) return;
    const existingIdx = cart.findIndex(c => c.id === id);
    
    if(osForce) {
        if(existingIdx > -1 && cart[existingIdx].os === osForce) cart.splice(existingIdx, 1);
        else if (existingIdx > -1) cart[existingIdx].os = osForce;
        else cart.push({...product, os: osForce, cartTab: currentTab});
    } else {
        if(currentTab === "แอพ-เกม iOS/Android") return; 
        if(existingIdx > -1) cart.splice(existingIdx, 1);
        else cart.push({...product, cartTab: currentTab});
    }
    updateCartUI();
    renderProducts();
}

function updateCartUI() {
    const bar = document.getElementById('bottomBar');
    if(cart.length > 0) bar.classList.add('active');
    else bar.classList.remove('active');

    let total = 0;
    const iosApps = cart.filter(c => c.cartTab === "แอพ-เกม iOS/Android");
    const otherApps = cart.filter(c => c.cartTab !== "แอพ-เกม iOS/Android");

    otherApps.forEach(item => total += Number(item.price));

    let countPromoApps = 0; let nonPromoTotal = 0;
    iosApps.forEach(app => {
        const p = Number(app.price);
        if(p >= 20 && p <= 25) countPromoApps++; else nonPromoTotal += p; 
    });

    let promoTotal = 0;
    if(countPromoApps === 30) promoTotal = 360;
    else if(countPromoApps === 15) promoTotal = 210;
    else if(countPromoApps === 8) promoTotal = 80;
    else if(countPromoApps >= 3) {
        const set8 = Math.floor(countPromoApps / 8), rem8 = countPromoApps % 8;
        const set3 = Math.floor(rem8 / 3), rem3 = rem8 % 3;
        promoTotal = (set8 * 80) + (set3 * 45) + (rem3 * 20);
    }
    else if(countPromoApps === 2) promoTotal = 45;
    else promoTotal = countPromoApps * 20;

    total += nonPromoTotal + promoTotal;
    document.getElementById('cartCountText').innerText = `${cart.length} รายการ | ${total}฿`;
    return total;
}

function toggleCheckoutModal() {
    if(cart.length === 0) return;
    const total = updateCartUI();
    let billText = "";

    if(cart[0].cartTab === "แอพ-เกม iOS/Android") {
        billText = `🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n✿ 𓈒 รวมยอด ꒰ ${total}฿ ꒱ ݂🎐 ♡ 🍃 ݂\n`;
        cart.forEach(c => { billText += `${c.name} [${c.os || ''}] 𓈒\n`; });
        billText += `---------------------------\nรบกวนรอแม่ค้าเช็คเมล-ยอดและส่งเลขบัญชีให้ทีครับ/ค่ะ 🙏`;
    } 
    else if(cart[0].cartTab === "เติมเกม") {
        billText = `🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n`;
        cart.forEach((c, i) => { 
            billText += `${i+1}. ${c.cat}\n   แพ็กเกจ: ${c.name}\n   ราคา: ${c.price} บาท\n`; 
        });
        billText += `---------------------------\n*ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\n*แจ้งไอดี ได้เลยค่ะ*`;
    }
    else { 
        billText = `🛒 รายการสั่งซื้อ (Wanderer Shop)\n---------------------------\n`;
        cart.forEach((c, i) => { 
            let pkgDesc = c.name + (c.desc ? ` (${c.desc})` : '');

            billText += `${i+1}. ${appMain}\n   แพ็กเกจ: ${pkgDesc}\n   ราคา: ${c.price} บาท\n`;

    }

    document.getElementById('checkoutTextarea').value = billText;

}

function renderAdminProductList(tab) {
    const listArea = document.getElementById('adminProdListContainer');

    if(prods.length === 0) {
        listArea.innerHTML = `<p style="text-align:center; color:#888; font-size:12px;">ยังไม่มีสินค้าในแท็บนี้</p>`;
        return;
    }

    listArea.innerHTML = prods.map(p => {
        let title = tab === "แอพ-เกม iOS/Android" ? p.name : `${p.cat||''} -> ${p.name||''}`;
        return `
            <div class="product-list-card">
                <div class="product-list-header">
                    <strong style="font-size:14px; color:#333;">${title}</strong>
                    <span style="color:var(--primary); font-weight:bold;">${p.price}฿</span>
                </div>
                <div style="font-size:12px; color:#666;">
                    ${tab === "แอพ-เกม iOS/Android" ? `ระบบ: ${p.os} | สถานะ: ${p.status}` : `กลุ่ม: ${p.subCat||'-'} | สถานะ: ${p.status||'ready'}`}
                </div>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <button class="btn-action" style="flex:1; margin:0;" onclick="editProduct('${p.id}')">✏️ แก้ไข</button>
                    <button class="btn-delete" style="flex:1;" onclick="deleteProduct('${p.id}')">🗑️ ลบ</button>
                </div>
            </div>
        `;
    }).join('');
}

function editProduct(id) {
    const p = products.find(x => x.id === id);
    if(!p) return;
    editingProductId = id;
    
    if(p.tab === "แอพ-เกม iOS/Android") {
        document.getElementById('pf_name').value = p.name || '';
        document.getElementById('pf_desc').value = p.desc || '';
        document.getElementById('pf_ios').checked = (p.os||'').includes('iOS');
        document.getElementById('pf_and').checked = (p.os||'').includes('Android');
        document.getElementById('pf_status').value = p.status || 'ready';
        document.getElementById('pf_price').value = p.price || 0;
        document.getElementById('pf_icon').value = p.icon || '';
    } else {
        document.getElementById('pf_cat').value = p.cat || '';
        document.getElementById('pf_appDesc').value = p.appDesc || '';
        document.getElementById('pf_subCat').value = p.subCat || '';
        document.getElementById('pf_name').value = p.name || '';
        document.getElementById('pf_desc').value = p.desc || '';
        document.getElementById('pf_status').value = p.status || 'ready';
        document.getElementById('pf_price').value = p.price || 0;
        document.getElementById('pf_icon').value = p.icon || '';
    }
    
    document.getElementById('btnSaveProd').innerText = "💾 บันทึกการแก้ไข";
    document.getElementById('btnCancelEdit').style.display = "block";
    document.getElementById('adminProdFormContainer').scrollIntoView({behavior: 'smooth'});
}

async function saveProductData(tab) {
    let payload = { action: editingProductId ? "edit_product" : "add", tab: tab };
    if(editingProductId) payload.id = editingProductId;
    
    if(tab === "แอพ-เกม iOS/Android") {
        let osArr = [];
        if(document.getElementById('pf_ios').checked) osArr.push("iOS");
        if(document.getElementById('pf_and').checked) osArr.push("Android");
        payload.name = document.getElementById('pf_name').value;
        payload.desc = document.getElementById('pf_desc').value;
        payload.os = osArr.join(',');
        payload.status = document.getElementById('pf_status').value;
        payload.price = document.getElementById('pf_price').value;
        payload.icon = document.getElementById('pf_icon').value;
    } else {
        payload.cat = document.getElementById('pf_cat').value;
        payload.appDesc = document.getElementById('pf_appDesc').value;
        payload.subCat = document.getElementById('pf_subCat').value;
        payload.name = document.getElementById('pf_name').value;
        payload.desc = document.getElementById('pf_desc').value;
        payload.status = document.getElementById('pf_status').value;
        payload.price = document.getElementById('pf_price').value;
        payload.icon = document.getElementById('pf_icon').value;
    }

    const btn = document.getElementById('btnSaveProd');
    btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
    
    try {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert("บันทึกข้อมูลสินค้าเรียบร้อย!");
        location.reload();
    } catch(e) { alert("เกิดข้อผิดพลาด"); btn.disabled = false; }
}

async function deleteProduct(id) {
    if(!confirm("คุณแน่ใจหรือไม่ที่จะลบสินค้ารายการนี้?")) return;
    try {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "delete_product", id: id }) });
        alert("ลบสำเร็จ!");
        location.reload();
    } catch(e) { alert("ลบไม่สำเร็จ"); }
}
