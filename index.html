<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer_Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* --- ดึง CSS ทั้งหมดจาก 005.txt --- */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --primary: #3B96F5; --secondary: #FF4B7E; --bg-main: #0A1D3A; --bg-card: #E1E8EE; --border-color: #C49646; --text-muted: #666; }
body { font-family: 'Kanit', sans-serif; background: var(--bg-main); color: #fff; overflow-x: hidden; padding-bottom: 110px; }

/* Background & Particles */
.bg-glow-1 { position: fixed; top: -100px; left: -100px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(176,38,255,0.15) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
.bg-glow-2 { position: fixed; bottom: 20%; right: -150px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,210,255,0.1) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
#pts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.pt { position: absolute; animation: ptUp linear infinite; opacity: 0; }
@keyframes ptUp { 0% { transform: translateY(105vh); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

/* UI Elements */
.status { position: fixed; top: 12px; left: 12px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #fff; z-index: 999; animation: pulse 1.5s infinite; }
.status.open { background: #00c853; }
.status.closed { background: #ff1744; }

.hero { display: flex; flex-direction: column; align-items: center; gap: 15px; background: linear-gradient(135deg, rgba(10,29,58,0.9) 0%, rgba(59,150,245,0.2) 100%); padding: 60px 20px 40px; text-align: center; border-bottom: 2px solid var(--border-color); position: relative; z-index: 2; margin-bottom: 30px; }
.hero-logo-frame { width: 180px; height: 180px; background: var(--bg-card); border: 4px solid var(--border-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 25px rgba(59,150,245,0.4); overflow: hidden; }
.hero-logo-img { width: 100%; height: 100%; object-fit: cover; }

.tab-nav { display: flex; overflow-x: auto; gap: 10px; padding: 0 20px 15px; justify-content: center; scrollbar-width: none; margin-top: -15px; }
.tab-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; }
.tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-color: transparent; }

/* Grid & Cards */
.content { max-width: 600px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 5; }
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
.app-card { background: var(--bg-card); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; color: #000; border: 2px solid transparent; position: relative; display: flex; flex-direction: column; align-items: center; }
.app-card:hover { transform: translateY(-3px); border-color: var(--primary); }
.app-card img { width: 70px; height: 70px; border-radius: 15px; margin-bottom: 10px; }
.app-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 3px 8px; border-radius: 12px; color: #fff; font-weight: bold; }
.app-badge.ready { background: #00c853; }

/* Cart & Bottom Bar */
.cart-panel { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%) translateY(150%); width: 90%; max-width: 500px; background: #fff; color: #000; border: 2px solid var(--border-color); border-radius: 12px; z-index: 999; transition: 0.3s; display: flex; flex-direction: column; max-height: 50vh; visibility: hidden; }
.cart-panel.open { transform: translateX(-50%) translateY(0); visibility: visible; }
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 29, 58, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--primary); padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; transform: translateY(100%); transition: 0.3s; z-index: 1000; }
.bottom-bar.active { transform: translateY(0); }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10001; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
.modal-box { background: #fff; color: #000; padding: 24px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; }

/* Loading Screen */
#loading-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <p style="margin-top: 15px; color: #aaa;">กำลังเตรียมข้อมูลร้านค้า...</p>
</div>

<div class="bg-glow-1"></div><div class="bg-glow-2"></div><div id="pts"></div>
<div id="shopStatus" class="status open">OPEN</div>

<div class="hero">
  <div class="hero-logo-frame">
    <img src="https://via.placeholder.com/180" class="hero-logo-img" id="shopLogo">
  </div>
  <h1 class="hero-title" onclick="checkAdminLogin()" style="cursor:pointer;">Wanderer_Shop</h1>
  <p id="welcomeMsg" class="hero-sub">ยินดีต้อนรับสู่ร้าน Wanderer_Shop</p>
</div>

<div class="tab-nav" id="tab-navigation"></div>

<div class="content">
    <div class="sort-container" style="display:flex; gap:10px; margin-bottom:15px;">
        <input type="text" class="search-box" placeholder="🔍 ค้นหาสินค้า..." oninput="handleSearch(this.value)" style="flex:1; padding:8px 15px; border-radius:20px; border:1px solid var(--border-color);">
    </div>
    
    <div id="main-content" class="app-grid"></div>
</div>

<div id="cartPanel" class="cart-panel">
  <div style="background:var(--border-color); color:#fff; padding:10px; text-align:center; font-weight:bold;">🛒 รายการที่เลือก</div>
  <div id="cartPanelList" style="padding:15px; overflow-y:auto;"></div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div style="cursor: pointer;" onclick="toggleCartPanel()">
    <div style="font-size:12px; color:#ccc;" id="cartCountText">เลือก 0 รายการ</div>
    <div style="font-size:20px; font-weight:bold;" id="cartTotalText">0฿</div>
  </div>
  <button onclick="openCheckoutModal()" style="background:linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; border-radius:25px; padding:10px 24px; font-weight:600; cursor:pointer;">สั่งซื้อสินค้า</button>
</div>

<div id="checkoutModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="color:var(--primary); margin-bottom:15px;">🛒 สรุปรายการสั่งซื้อ</h3>
    <div id="modalOrderDetails" style="text-align:left; background:#f0f5fa; padding:15px; border-radius:8px; margin-bottom:15px; font-size:14px; white-space:pre-wrap;"></div>
    <button onclick="confirmCheckout()" style="background:#00c853; color:#fff; padding:12px; border:none; border-radius:8px; width:100%; font-weight:bold; cursor:pointer; margin-bottom:10px;">คัดลอกและไปที่ไลน์</button>
    <button onclick="closeCheckoutModal()" style="background:#eee; color:#666; padding:10px; border:none; border-radius:8px; width:100%; cursor:pointer;">ยกเลิก</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzN4Wjo9Sjui0oKjrUih8sZSyt5m_Zxx8cO3hW-rRzMWXsHremcBss43VDSwYW6Bwf7pw/exec"; 

let products = [];
let storeInfo = {};
let cart = [];
let currentTab = "ข้อมูลร้าน";
let currentSearch = "";
let shownPopups = [];

// 1. ระบบตกแต่งใบไม้ร่วง 
try {
  const P = document.getElementById('pts');
  ['🎐','🍃','🌌'].forEach(e => {
    for (let j = 0; j < 5; j++) {
      const d = document.createElement('div');
      d.className = 'pt'; d.textContent = e;
      d.style.cssText = `left:${Math.random()*100}vw; font-size:${12+Math.random()*15}px; animation-duration:${10+Math.random()*15}s; animation-delay:${-Math.random()*20}s;`;
      P.appendChild(d);
    }
  });
} catch(e){}

// 2. โหลดข้อมูลแบบกันค้าง [cite: 86, 97]
async function loadData() {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000); 

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "get_data" }),
            signal: controller.signal
        });
        const data = await response.json();
        
        if (data) {
            products = data.products || [];
            storeInfo = data.storeInfo || {};
            applyStoreInfo();
            renderTabs();
            switchTab(currentTab);
        }
    } catch (err) {
        console.error("Load failed", err);
        document.getElementById('main-content').innerHTML = "<p>⚠️ เชื่อมต่อไม่ได้ กรุณารีเฟรชหน้าจอ</p>";
    } finally {
        document.getElementById('loading-screen').style.display = 'none';
    }
}

function applyStoreInfo() {
    document.getElementById('shopStatus').className = `status ${storeInfo.status || 'open'}`;
    document.getElementById('shopStatus').innerText = (storeInfo.status || 'OPEN').toUpperCase();
    document.getElementById('welcomeMsg').innerText = storeInfo.welcome || "ยินดีต้อนรับสู่ Wanderer_Shop";
    if(storeInfo.logo) document.getElementById('shopLogo').src = storeInfo.logo;
}

function renderTabs() {
    const nav = document.getElementById('tab-navigation');
    const tabs = ["ข้อมูลร้าน", ...new Set(products.map(p => p.mainTab))];
    nav.innerHTML = tabs.filter(t => t && !["Orders","Popups"].includes(t)).map(t => 
        `<button class="tab-btn ${t===currentTab?'active':''}" onclick="switchTab('${t}')">${t}</button>`
    ).join('');
}

function switchTab(t) {
    currentTab = t;
    renderTabs();
    const content = document.getElementById('main-content');
    
    if(t === "ข้อมูลร้าน") {
        content.innerHTML = `<div style="background:var(--bg-card); color:#000; padding:20px; border-radius:15px; text-align:center;">
            <h3>ติดต่อเรา</h3>
            <p>Line ID: ${storeInfo.line || '@wanderer'}</p>
            <p>เวลาทำการ: ${storeInfo.hours || '11:00 - 00:00'}</p>
        </div>`;
        return;
    }

    const filtered = products.filter(p => p.mainTab === t && p.name.toLowerCase().includes(currentSearch));
    content.innerHTML = filtered.map(p => `
        <div class="app-card" onclick="addToCart('${p.id}')">
            <div class="app-badge ready">พร้อมส่ง</div>
            <img src="${p.image}">
            <h4 style="font-size:14px;">${p.name}</h4>
            <p style="color:var(--primary); font-weight:bold;">฿${p.price1 || p.price || '0'}</p>
        </div>
    `).join('');
}

// 3. ระบบตะกร้า & สรุปยอด [cite: 317, 346]
function addToCart(id) {
    const p = products.find(i => i.id === id);
    if(p) {
        cart.push(p);
        updateCartUI();
        alert(`เพิ่ม ${p.name} ลงตะกร้าแล้ว!`);
    }
}

function updateCartUI() {
    const bar = document.getElementById('bottomBar');
    if(cart.length > 0) bar.classList.add('active');
    else bar.classList.remove('active');

    document.getElementById('cartCountText').innerText = `เลือก ${cart.length} รายการ`;
    const total = cart.reduce((sum, item) => sum + Number(item.price1 || item.price || 0), 0);
    document.getElementById('cartTotalText').innerText = `${total}฿`;
}

function toggleCartPanel() {
    document.getElementById('cartPanel').classList.toggle('open');
    const list = document.getElementById('cartPanelList');
    list.innerHTML = cart.map((item, idx) => `
        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed #ddd; color:#000;">
            <span>${item.name}</span>
            <button onclick="removeFromCart(${idx})" style="color:red; border:none; background:none;">ลบ</button>
        </div>
    `).join('');
}

function removeFromCart(idx) {
    cart.splice(idx, 1);
    updateCartUI();
    toggleCartPanel(); toggleCartPanel(); // Refresh list
}

function openCheckoutModal() {
    const details = cart.map(i => `- ${i.name} : ${i.price1 || i.price}฿`).join('\n');
    const total = cart.reduce((sum, item) => sum + Number(item.price1 || item.price || 0), 0);
    document.getElementById('modalOrderDetails').innerText = `รายการสั่งซื้อ:\n${details}\n\nยอดรวมทั้งหมด: ${total}฿`;
    document.getElementById('checkoutModal').style.display = 'flex';
}

function confirmCheckout() {
    const text = document.getElementById('modalOrderDetails').innerText;
    navigator.clipboard.writeText(text);
    alert("คัดลอกรายการแล้ว! กำลังไปที่ LINE");
    window.location.href = `https://line.me/R/ti/p/~${storeInfo.line || '@wanderer'}`;
}

function closeCheckoutModal() { document.getElementById('checkoutModal').style.display = 'none'; }
function handleSearch(v) { currentSearch = v.toLowerCase(); switchTab(currentTab); }
function checkAdminLogin() { 
    const pass = prompt("กรุณาใส่รหัสผ่านแอดมิน:");
    if(pass === "1234") alert("ยินดีต้อนรับแอดมิน! (ระบบสถิติกำลังพัฒนา)");
}

window.onload = loadData;
</script>
</body>
</html>
