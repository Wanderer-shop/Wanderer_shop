<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer_Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= CSS ธีมและสี ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { 
    --primary: #3B96F5; --secondary: #FF4B7E; --bg-main: #0A1D3A; 
    --bg-card: #E1E8EE; --border-color: #C49646; --text-muted: #666; 
}
body { font-family: 'Kanit', sans-serif; background: var(--bg-main); color: #fff; overflow-x: hidden; padding-bottom: 120px; }

/* เอฟเฟกต์พื้นหลัง */
.bg-glow-1 { position: fixed; top: -100px; left: -100px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(59,150,245,0.2) 0%, transparent 70%); z-index: -1; pointer-events: none; }
.bg-glow-2 { position: fixed; bottom: 20%; right: -150px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,75,126,0.15) 0%, transparent 70%); z-index: -1; pointer-events: none; }
#pts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.pt { position: absolute; animation: ptUp linear infinite; opacity: 0; }
@keyframes ptUp { 0% { transform: translateY(105vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

/* ป้ายสถานะร้าน */
.status { position: fixed; top: 12px; left: 12px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #fff; z-index: 999; animation: pulse 1.5s infinite; box-shadow: 0 0 10px rgba(0,0,0,0.5); text-transform: uppercase; }
.status.open { background: #00c853; } .status.closed { background: #ff1744; } .status.slow { background: #fbc02d; color:#000; } .status.pause { background: #f57c00; }
@keyframes pulse { 0% { transform: scale(1); opacity:1;} 50% { transform: scale(1.05); opacity:0.8;} 100% { transform: scale(1); opacity:1;} }

/* Hero Section & Slider */
.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(135deg, rgba(10,29,58,0.9) 0%, rgba(59,150,245,0.2) 100%); padding: 50px 20px 30px; text-align: center; border-bottom: 2px solid var(--border-color); position: relative; z-index: 2; margin-bottom: 20px; }
.hero-slider { display: flex; align-items: center; gap: 15px; }
.slider-btn { background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.hero-logo-frame { width: 140px; height: 140px; background: var(--bg-card); border: 4px solid var(--border-color); border-radius: 15px; overflow: hidden; }
.hero-logo-img { width: 100%; height: 100%; object-fit: cover; }
.hero-title { font-family: 'Mitr', sans-serif; font-size: 28px; font-weight: 700; color: #fff; text-shadow: 0 0 10px var(--primary); cursor: pointer; user-select: none; }
.hero-welcome { font-size: 14px; color: #ddd; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--primary); }

/* แท็บเมนู */
.tab-nav { display: flex; overflow-x: auto; gap: 10px; padding: 10px 20px; justify-content: flex-start; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid var(--border-color); padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; }
.tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-color: transparent; }

/* หัวข้อและจัดเรียง */
.content-header { max-width: 600px; margin: 15px auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
.content-title { font-size: 16px; font-weight: bold; color: var(--primary); }
.sort-select { background: var(--bg-card); color: #000; border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 8px; font-size: 12px; outline: none; }

/* Grid สินค้า */
.content { max-width: 600px; margin: 0 auto; padding: 0 20px; }
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }

/* การ์ดสินค้า */
.app-card { background: var(--bg-card); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; color: #000; position: relative; border: 2px solid transparent; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
.app-card.selected { border-color: #9c27b0; background: #f3e5f5; }
.app-card.selected::before { content: '✓'; position: absolute; top: -5px; left: -5px; background: #9c27b0; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; z-index: 10; border: 2px solid #fff; }
.app-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 3px 6px; border-radius: 8px; color: #fff; font-weight: bold; z-index: 5; }
.badge-ready { background: #00c853; } .badge-notready { background: #ff1744; }
.app-card img { width: 70px; height: 70px; border-radius: 15px; object-fit: cover; margin-bottom: 8px; }
.app-name { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-bottom: 5px; }
.app-desc { font-size: 11px; color: #666; margin-bottom: 8px; height: 16px; overflow: hidden; }

/* OS Card เฉพาะ (160x175) */
.os-card { width: 160px; height: 175px; margin: 0 auto; }
.os-buttons { display: flex; gap: 5px; width: 100%; margin-top: auto; }
.os-btn { flex: 1; padding: 5px; font-size: 11px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
.os-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.price-tag { font-weight: bold; color: var(--secondary); font-size: 14px; margin-top: auto; }

/* ตะกร้าสินค้า */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 29, 58, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--primary); padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; transform: translateY(100%); transition: 0.3s; z-index: 1000; }
.bottom-bar.active { transform: translateY(0); }
.cart-header-box { background: rgba(59,150,245,0.2); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10001; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: #fff; color: #000; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
.btn-main { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
.btn-close { background: #eee; color: #333; border: none; padding: 10px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 5px; }

/* Admin Panel */
.admin-tab-nav { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; }
.admin-tab { padding: 5px 10px; background: #eee; border:none; border-radius:5px; cursor:pointer; font-size:12px; }
.admin-tab.active { background: var(--primary); color: #fff; }
.admin-input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
.admin-icon { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; background: #b39ddb; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; }
</style>
</head>
<body>

<div class="bg-glow-1"></div><div class="bg-glow-2"></div><div id="pts"></div>

<div id="shopStatus" class="status open">OPEN</div>

<div class="hero">
  <div class="hero-slider">
    <button class="slider-btn" onclick="slideImage(-1)">◀</button>
    <div class="hero-logo-frame"><img src="https://via.placeholder.com/150" id="shopLogo" class="hero-logo-img"></div>
    <button class="slider-btn" onclick="slideImage(1)">▶</button>
  </div>
  <h1 class="hero-title" id="shopTitle">Wanderer_Shop</h1>
  <div class="hero-welcome" id="welcomeMsg">ยินดีต้อนรับสู่ร้าน Wanderer_Shop รับอะไรดีคะ</div>
</div>

<div class="tab-nav" id="tabNavigation"></div>

<div class="content-header">
  <div class="content-title">รายการสินค้า</div>
  <select class="sort-select" id="sortSelect" onchange="renderProducts()">
    <option value="name">เรียงตามอักษร</option>
    <option value="price_asc">ราคา (น้อยไปมาก)</option>
    <option value="price_desc">ราคา (มากไปน้อย)</option>
  </select>
</div>

<div class="content">
  <div id="main-content" class="app-grid">
    <div style="text-align:center; grid-column:1/-1; padding:40px;">กำลังโหลดข้อมูล...</div>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="cart-header-box" onclick="openCheckoutModal()">
    <div style="font-size:12px; font-weight:bold; color:var(--primary);">🛒 ดูรายการที่เลือก</div>
    <div style="font-size:11px; color:#fff;" id="cartCountText">0 รายการ | 0฿</div>
  </div>
  <button class="btn-main" style="width:auto; padding:10px 30px;" onclick="processCheckout()">สั่งซื้อสินค้า</button>
</div>

<div id="checkoutModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="color:var(--primary); text-align:center; margin-bottom:15px;">🛒 สรุปรายการสั่งซื้อ</h3>
    <textarea id="checkoutTextarea" style="width:100%; height:200px; padding:10px; font-family:inherit; border-radius:8px; border:1px solid #ccc; margin-bottom:10px;" readonly></textarea>
    <button class="btn-main" id="confirmOrderBtn" onclick="confirmOrder()">คัดลอกและไปที่ LINE</button>
    <button class="btn-close" onclick="closeModal('checkoutModal')">ปิด</button>
  </div>
</div>

<div id="adminLoginModal" class="modal-overlay">
  <div class="modal-box" style="text-align:center;">
    <h3>🔒 เข้าสู่ระบบแอดมิน</h3>
    <input type="password" id="adminPwd" class="admin-input" style="margin-top:15px;" placeholder="รหัสผ่าน">
    <button class="btn-main" onclick="verifyAdmin()">ยืนยัน</button>
    <button class="btn-close" onclick="closeModal('adminLoginModal')">ยกเลิก</button>
  </div>
</div>

<div id="adminDashboard" class="modal-overlay">
  <div class="modal-box">
    <h3>⚙️ จัดการร้านค้า</h3>
    <div class="admin-tab-nav" id="adminTabs">
      <button class="admin-tab active" onclick="switchAdminTab('shop')">ร้านค้า</button>
      <button class="admin-tab" onclick="switchAdminTab('products')">สินค้า</button>
      <button class="admin-tab" onclick="switchAdminTab('stats')">สถิติ</button>
    </div>
    <div id="adminContent" style="max-height: 50vh; overflow-y:auto; padding-right:5px;"></div>
    <button class="btn-main" onclick="saveAdminData()" style="background:#00c853;">💾 บันทึกข้อมูล</button>
    <button class="btn-close" onclick="closeModal('adminDashboard')">ปิด (ย่อไว้)</button>
  </div>
</div>

<div class="admin-icon" id="adminFloatBtn" onclick="openAdminDashboard()">+</div>

<script>
// ================= การตั้งค่าพื้นฐาน =================
const API_URL = "https://script.google.com/macros/s/AKfycbxSgNZkAvnU5bw33tu9RM2AZOCpgrvASdU_nZVbdjzJ8__5DZFGLn0NEmP24o9aXvnF/exec"; 

let storeData = { 
    status: 'open', welcome: 'ยินดีต้อนรับสู่ร้าน Wanderer_Shop รับอะไรดีคะ', 
    line: '@wanderer', images: ['https://via.placeholder.com/150'] 
};
let products = [];
let cart = [];
let currentTab = "";
let currentImgIndex = 0;
let isAdmin = false;

// ================= ระบบตกแต่ง =================
const P = document.getElementById('pts');
['🎐','🍃','🌌'].forEach(e => {
  for (let j = 0; j < 6; j++) {
    const d = document.createElement('div');
    d.className = 'pt'; d.textContent = e;
    d.style.cssText = `left:${Math.random()*100}vw; font-size:${12+Math.random()*15}px; animation-duration:${10+Math.random()*15}s; animation-delay:${-Math.random()*20}s;`;
    P.appendChild(d);
  }
});

// Slider รูปภาพ
function slideImage(dir) {
    if(storeData.images.length === 0) return;
    currentImgIndex += dir;
    if(currentImgIndex >= storeData.images.length) currentImgIndex = 0;
    if(currentImgIndex < 0) currentImgIndex = storeData.images.length - 1;
    document.getElementById('shopLogo').src = storeData.images[currentImgIndex];
}

// ================= ระบบดึงข้อมูล =================
async function initApp() {
    try {
        const response = await fetch(`${API_URL}?t=${Date.now()}`, { method: 'POST', body: JSON.stringify({ action: "get_data" }) });
        const data = await response.json();
        if (data) {
            products = data.products || [];
            storeData = data.storeInfo || storeData;
            applyStoreInfo();
            renderTabs();
        }
    } catch(err) {
        document.getElementById('main-content').innerHTML = `<p style="color:red; text-align:center;">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรช</p>`;
    }
}

function applyStoreInfo() {
    const st = document.getElementById('shopStatus');
    st.className = `status ${storeData.status.toLowerCase()}`;
    st.innerText = storeData.status.toUpperCase();
    document.getElementById('welcomeMsg').innerText = storeData.welcome;
    if(storeData.images && storeData.images.length > 0) {
        document.getElementById('shopLogo').src = storeData.images[0];
    }
}

// ================= ระบบแท็บ & สินค้า =================
function renderTabs() {
    const nav = document.getElementById('tabNavigation');
    let tabs = [...new Set(products.map(p => p.tab))].filter(t => t);
    tabs.unshift("ข้อมูลร้าน"); // แท็บพิเศษ
    
    if(!currentTab) currentTab = tabs[0];
    
    nav.innerHTML = tabs.map(t => `<button class="tab-btn ${t === currentTab ? 'active' : ''}" onclick="switchTab('${t}')">${t}</button>`).join('');
    renderProducts();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === tab);
    });
    renderProducts();
}

function renderProducts() {
    const content = document.getElementById('main-content');
    
    // หน้าข้อมูลติดต่อ
    if(currentTab === "ข้อมูลร้าน") {
        content.innerHTML = `
            <div style="background:var(--bg-card); color:#000; padding:20px; border-radius:15px; text-align:center;">
                <h3 style="color:var(--primary); margin-bottom:10px;">ช่องทางการติดต่อ</h3>
                <p>LINE: <strong>${storeData.line}</strong> <button onclick="navigator.clipboard.writeText('${storeData.line}'); alert('คัดลอกแล้ว');" style="padding:2px 8px; font-size:10px; border-radius:5px;">คัดลอก</button></p>
                <p style="margin-top:10px;">เวลาทำการ: ${storeData.hours || 'ไม่ได้ระบุ'}</p>
                <p style="margin-top:10px; font-size:12px; color:#555;">${storeData.warranty || ''}</p>
            </div>`;
        return;
    }

    // กรองและเรียงสินค้า
    let filtered = products.filter(p => p.tab === currentTab);
    const sortVal = document.getElementById('sortSelect').value;
    if(sortVal === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
    if(sortVal === 'price_asc') filtered.sort((a,b) => Number(a.price) - Number(b.price));
    if(sortVal === 'price_desc') filtered.sort((a,b) => Number(b.price) - Number(a.price));

    if(filtered.length === 0) {
        content.innerHTML = `<div style="grid-column:1/-1; text-align:center;">ไม่มีสินค้าในหมวดนี้</div>`;
        return;
    }

    content.innerHTML = filtered.map(p => {
        // เช็คว่าอยู่ในตะกร้าไหม
        const inCart = cart.find(c => c.id === p.id);
        const cardClass = currentTab === "แอพ/เกม IOS-ANDROID" ? "app-card os-card" : "app-card";
        const badge = p.status === 'not_ready' ? `<div class="app-badge badge-notready">เมลไม่พร้อม</div>` : `<div class="app-badge badge-ready">พร้อมส่ง</div>`;
        
        let osButtons = '';
        if(currentTab === "แอพ/เกม IOS-ANDROID") {
            const selectedOS = inCart ? inCart.os : '';
            osButtons = `
                <div class="os-buttons">
                    <button class="os-btn ${selectedOS === 'iOS' ? 'active' : ''}" onclick="event.stopPropagation(); toggleCart('${p.id}', 'iOS')">iOS</button>
                    <button class="os-btn ${selectedOS === 'Android' ? 'active' : ''}" onclick="event.stopPropagation(); toggleCart('${p.id}', 'Android')">Android</button>
                </div>`;
        }

        return `
            <div class="${cardClass} ${inCart ? 'selected' : ''}" onclick="toggleCart('${p.id}', null)">
                ${badge}
                <img src="${p.image}" onerror="this.src='https://via.placeholder.com/70'">
                <div class="app-name">${p.name}</div>
                <div class="app-desc">${p.desc || ''}</div>
                <div class="price-tag">${p.price}฿</div>
                ${osButtons}
            </div>
        `;
    }).join('');
}

// ================= ระบบตะกร้า & โปรโมชัน =================
function toggleCart(id, osForce) {
    if(currentTab === "ข้อมูลร้าน") return;
    
    const product = products.find(p => p.id === id);
    if(!product) return;

    const existingIdx = cart.findIndex(c => c.id === id);
    
    // ถ้าระบุ OS ให้จัดการอัปเดตหรือลบ
    if(osForce) {
        if(existingIdx > -1 && cart[existingIdx].os === osForce) {
            cart.splice(existingIdx, 1); // กดซ้ำเอาออก
        } else if (existingIdx > -1) {
            cart[existingIdx].os = osForce; // เปลี่ยน OS
        } else {
            cart.push({...product, os: osForce, cartTab: currentTab});
        }
    } else {
        // หมวดปกติ กดเพื่อสลับเข้า/ออก
        if(currentTab === "แอพ/เกม IOS-ANDROID") return; // หมวดนี้บังคับกดปุ่ม OS
        if(existingIdx > -1) cart.splice(existingIdx, 1);
        else cart.push({...product, cartTab: currentTab});
    }

    updateCartUI();
    renderProducts(); // รีเฟรชกรอบสีม่วง
}

function updateCartUI() {
    const bar = document.getElementById('bottomBar');
    if(cart.length > 0) bar.classList.add('active');
    else bar.classList.remove('active');

    // คำนวณยอด
    let total = 0;
    
    // แยกหมวดหมู่คำนวณ
    const iosApps = cart.filter(c => c.cartTab === "แอพ/เกม IOS-ANDROID");
    const otherApps = cart.filter(c => c.cartTab !== "แอพ/เกม IOS-ANDROID");

    // คำนวณหมวดอื่นๆ ปกติ
    otherApps.forEach(item => total += Number(item.price));

    // ระบบโปรโมชัน IOS-ANDROID
    let countPromoApps = 0;
    let nonPromoTotal = 0;

    iosApps.forEach(app => {
        const p = Number(app.price);
        if(p >= 20 && p <= 25) countPromoApps++;
        else nonPromoTotal += p; // ราคา 35-50 ไม่ร่วมโปร
    });

    let promoTotal = 0;
    if(countPromoApps === 30) promoTotal = 360;
    else if(countPromoApps === 15) promoTotal = 210;
    else if(countPromoApps === 8) promoTotal = 80;
    else if(countPromoApps >= 3) {
        // ลดหลั่นตามขั้น
        const set8 = Math.floor(countPromoApps / 8);
        const rem8 = countPromoApps % 8;
        const set3 = Math.floor(rem8 / 3);
        const rem3 = rem8 % 3;
        promoTotal = (set8 * 80) + (set3 * 45) + (rem3 * 20); // สมมติฐานราคาเต็ม 20
    }
    else if(countPromoApps === 2) promoTotal = 45; // เงื่อนไข 13.2 รับ 2 แอพ 45฿
    else promoTotal = countPromoApps * 20;

    total += nonPromoTotal + promoTotal;

    document.getElementById('cartCountText').innerText = `${cart.length} รายการ | ${total}฿`;
    return total;
}

// ================= ระบบบิล & สั่งซื้อ =================
function openCheckoutModal() {
    if(cart.length === 0) return;
    const total = updateCartUI();
    let billText = "";

    // สร้างฟอร์แมตตามแท็บ
    if(currentTab === "แอพ/เกม IOS-ANDROID") {
        billText = `🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n✿ 𓈒 รวมยอด ꒰ ${total}฿ ꒱ ݂🎐 ♡ 🍃 ݂\n`;
        cart.forEach(c => {
            billText += `${c.name} [${c.os || ''}] 𓈒\n`;
        });
        billText += `---------------------------\nรบกวนรอแม่ค้าเช็คเมล-ยอดและส่งเลขบัญชีให้ทีครับ/ค่ะ 🙏`;
    } 
    else if(currentTab === "เติมเกม") {
        billText = `🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n`;
        cart.forEach((c, i) => {
            billText += `${i+1}. ${c.name}\n   แพ็กเกจ: ${c.subPackage || '-'}\n   ราคา: ${c.price} บาท\n`;
        });
        billText += `---------------------------\n*ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\n*แจ้งไอดี ได้เลยค่ะ*`;
    }
    else {
        // ค่าเริ่มต้น / แอพพรีเมียม
        billText = `🛒 รายการสั่งซื้อ (Wanderer Shop)\n---------------------------\n`;
        cart.forEach((c, i) => {
            billText += `${i+1}. ${c.name}\n   แพ็กเกจ: ${c.subPackage || c.desc || '-'}\n   ราคา: ${c.price} บาท\n`;
        });
        billText += `---------------------------\n*ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\nรบกวนรอแอดมินตอบก่อนค่อยโอนนะคะ`;
    }

    document.getElementById('checkoutTextarea').value = billText;
    document.getElementById('checkoutModal').style.display = 'flex';
}

function processCheckout() { openCheckoutModal(); }

async function confirmOrder() {
    const text = document.getElementById('checkoutTextarea').value;
    const btn = document.getElementById('confirmOrderBtn');
    
    // เก็บลงชีต (ยิงแบบไม่รอเพื่อไม่ให้ค้าง)
    btn.innerText = "กำลังบันทึก...";
    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "save_order", items: text }),
            signal: AbortSignal.timeout(3000)
        });
    } catch(e) {} // ข้ามถ้าเน็ตช้า

    // คัดลอกและไปไลน์
    navigator.clipboard.writeText(text).then(() => {
        window.location.href = `https://line.me/R/ti/p/~${storeData.line}`;
    }).catch(() => {
        alert("คัดลอกด้วยตัวเองแล้วกดส่งไปที่ไลน์: " + storeData.line);
        window.location.href = `https://line.me/R/ti/p/~${storeData.line}`;
    });
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// ================= ระบบแอดมิน =================
let clickCount = 0;
document.getElementById('shopTitle').addEventListener('click', () => {
    clickCount++;
    if(clickCount >= 5) {
        clickCount = 0;
        if(sessionStorage.getItem('adminLogged') === 'true') {
            openAdminDashboard();
        } else {
            document.getElementById('adminLoginModal').style.display = 'flex';
        }
    }
    setTimeout(() => clickCount = 0, 2000);
});

function verifyAdmin() {
    if(document.getElementById('adminPwd').value === "170647") {
        sessionStorage.setItem('adminLogged', 'true');
        document.getElementById('adminLoginModal').style.display = 'none';
        document.getElementById('adminFloatBtn').style.display = 'flex'; // แสดงปุ่มลอย
        openAdminDashboard();
    } else {
        alert("รหัสผิด!");
    }
}

// ถ้าเคยล็อกอินแล้ว ให้แสดงปุ่มลอยเลยตอนโหลด
if(sessionStorage.getItem('adminLogged') === 'true') {
    document.getElementById('adminFloatBtn').style.display = 'flex';
}

function openAdminDashboard() {
    document.getElementById('adminDashboard').style.display = 'flex';
    switchAdminTab('shop'); // เปิดแท็บแรก
}

function switchAdminTab(tab) {
    document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    const content = document.getElementById('adminContent');
    if(tab === 'shop') {
        content.innerHTML = `
            <label>สถานะร้าน</label>
            <select id="admStatus" class="admin-input">
                <option value="open">เปิด (OPEN)</option>
                <option value="closed">ปิด (CLOSED)</option>
                <option value="slow">ตอบช้า (SLOW)</option>
                <option value="pause">พักส่ง (PAUSE)</option>
            </select>
            <label>ไลน์ร้าน (มี @)</label>
            <input type="text" id="admLine" class="admin-input" value="${storeData.line}">
            <label>ข้อความต้อนรับ</label>
            <input type="text" id="admWelcome" class="admin-input" value="${storeData.welcome}">
        `;
        document.getElementById('admStatus').value = storeData.status;
    } else if (tab === 'products') {
        content.innerHTML = `
            <p style="font-size:12px; color:red;">*แก้ไขข้อมูลแล้วอย่าลืมกดบันทึก</p>
            ${products.map((p, i) => `
                <div style="border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:8px;">
                    <input type="text" class="admin-input" value="${p.name}" id="p_name_${i}" placeholder="ชื่อแอป">
                    <input type="text" class="admin-input" value="${p.price}" id="p_price_${i}" placeholder="ราคา">
                    <button style="background:red; color:white; border:none; padding:5px; border-radius:5px;" onclick="alert('ฟังก์ชันลบจะลบข้อมูลในชีต')">ลบสินค้านี้</button>
                </div>
            `).join('')}
        `;
    } else {
        content.innerHTML = `<p style="text-align:center;">ระบบสถิติกำลังพัฒนา</p>`;
    }
}

async function saveAdminData() {
    // ดึงค่ามาบันทึก
    if(document.getElementById('admStatus')) {
        storeData.status = document.getElementById('admStatus').value;
        storeData.line = document.getElementById('admLine').value;
        storeData.welcome = document.getElementById('admWelcome').value;
    }
    
    alert("บันทึกข้อมูลเรียบร้อย (ระบบจะซิงค์กับชีต)");
    applyStoreInfo();
    // ⚠️ หมายเหตุ: หน้าต่างแอดมินจะไม่ปิดเองตามที่ขอในข้อ 1.สามารถเพิ่มระบบให้หน้าแอดมินไม่เด้งออกทุกครั้งที่บันทึกได้ไหม 
}
