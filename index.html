<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer_Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================== CSS ธีมและโครงสร้าง ================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #3B96F5;
  --secondary: #FF4B7E;
  --bg-main: #0A1D3A;
  --bg-card: #E1E8EE;
  --border-color: #C49646;
  --text-muted: #555;
  --text-dark: #000;
}
body {
  font-family: 'Kanit', sans-serif;
  background: var(--bg-main); color: #fff;
  overflow-x: hidden; padding-bottom: 110px;
}

/* 8. พื้นหลัง Emoji */
#pts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.pt { position: absolute; animation: ptUp linear infinite; opacity: 0; user-select: none; }
@keyframes ptUp {
  0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.4; }
  90% { opacity: 0.4; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* 1. ป้ายสถานะร้าน */
.shop-status {
  position: absolute; top: 15px; left: 15px;
  padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #fff;
  display: flex; align-items: center; gap: 6px; z-index: 50;
  background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 1.5s infinite; }
.status-open .status-dot { background: #00d300; box-shadow: 0 0 8px #00d300; }
.status-closed .status-dot { background: #ff3b3b; box-shadow: 0 0 8px #ff3b3b; }
.status-slow .status-dot { background: #ffeb3b; box-shadow: 0 0 8px #ffeb3b; }
.status-pause .status-dot { background: #ff9800; box-shadow: 0 0 8px #ff9800; }
@keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; } }

/* Header & ข้อความต้อนรับ */
.hero {
  padding: 60px 20px 55px; text-align: center; position: relative;
  border-bottom: 1px solid rgba(196,150,70,0.4); margin-bottom: 40px; z-index: 10;
}
.hero-title { font-family: 'Mitr', sans-serif; font-size: 32px; font-weight: 700; cursor: pointer; user-select: none; }
.hero-sub { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 5px; }

/* 2. แท็บเมนู */
.tab-scroll-container {
  position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
  width: 90%; max-width: 500px; overflow-x: auto; white-space: nowrap;
  background: var(--bg-card); border-radius: 30px; padding: 4px; display: flex; gap: 5px;
  border: 1px solid var(--border-color); scrollbar-width: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.tab-scroll-container::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 8px 16px; border-radius: 25px; border: none; font-size: 13px; font-weight: 600;
  cursor: pointer; background: transparent; color: var(--text-muted); flex: 0 0 auto; transition: 0.3s;
}
.tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }

/* 3. ระบบการ์ดสินค้า */
.content { max-width: 800px; margin: 0 auto; padding: 0 20px 50px; position: relative; z-index: 5; }
.filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.sort-select { background: var(--bg-card); color: var(--text-dark); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 10px; font-family: 'Kanit'; font-size: 13px; outline: none; }

.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.item-card {
  background: var(--bg-card); border-radius: 16px; padding: 15px; position: relative;
  cursor: pointer; display: flex; flex-direction: column; border: 2px solid transparent; color: var(--text-dark);
  transition: all 0.2s; min-height: 175px; /* ขนาดพิเศษตามข้อ 3.2 */
}
.item-card.selected { border-color: #8b5cf6; background: linear-gradient(145deg, rgba(139, 92, 246, 0.1), var(--bg-card)); }

.card-icon { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; margin-bottom: 10px; background: #ccc; }
.card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.card-desc { font-size: 11px; color: var(--text-muted); flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-price { align-self: flex-start; color: var(--primary); font-weight: 700; font-size: 15px; margin-top: 8px; }

/* 3.3 ติ๊กถูก & สถานะแอป */
.check-circle { position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.8); z-index: 2; transition: 0.2s; }
.item-card.selected .check-circle { background: #8b5cf6; border-color: #8b5cf6; }
.check-circle::after { content: '✓'; color: #fff; font-size: 12px; opacity: 0; font-weight: bold; }
.item-card.selected .check-circle::after { opacity: 1; }

.app-status { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 8px; color: #fff; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.status-ready { background: #00d300; }
.status-notready { background: #ff3b3b; }

/* 4. ตะกร้าสินค้า Bottom Bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 29, 58, 0.95); backdrop-filter: blur(10px);
  border-top: 1px solid var(--primary); padding: 15px 24px; display: flex; justify-content: space-between; align-items: center;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
}
.bottom-bar.active { transform: translateY(0); }
.bb-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; border-radius: 25px; padding: 12px 24px; font-weight: 600; font-family: 'Kanit'; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 75, 126, 0.4); }

/* สัญลักษณ์แอดมิน 6.4 */
#admin-badge {
  position: fixed; bottom: 80px; right: 20px; width: 55px; height: 55px; background: #c084fc; border-radius: 50%;
  display: none; justify-content: center; align-items: center; color: #fff; font-size: 28px; font-weight: bold;
  box-shadow: 0 4px 15px rgba(192, 132, 252, 0.5); z-index: 999; cursor: pointer; border: 2px solid #fff;
}

/* Modal โหลดดิ้ง และ Admin */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; justify-content: center; align-items: center; }
.loader { border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Admin Modal ย่อ */
.admin-modal { background: #fff; color: #000; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; border-radius: 16px; padding: 20px; position: relative; }
.close-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 20px; font-weight: bold; color: #ff3b3b; }
.admin-form input, .admin-form select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Kanit'; }
.admin-btn { padding: 10px 15px; background: #3B96F5; color: #fff; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-family: 'Kanit'; }
</style>
</head>
<body>

<div id="pts"></div>

<div class="shop-status status-open" id="shopStatusPill">
  <div class="status-dot"></div>
  <span id="shopStatusText">OPEN</span>
</div>

<div id="admin-badge" onclick="openAdmin()">+</div>

<div class="hero">
  <div class="hero-title" onclick="adminLoginClick()">Wanderer_Shop</div>
  <div class="hero-sub" id="welcomeText">ยินดีต้อนรับสู่ร้าน Wanderer_Shop รับอะไรดีคะ</div>
  
  <div class="tab-scroll-container" id="tabContainer">
    </div>
</div>

<div class="content">
  <div class="filter-row">
    <h2 style="font-size: 18px;" id="currentTabTitle">กำลังโหลด...</h2>
    <select class="sort-select" id="sortSelect" onchange="renderProducts()">
      <option value="name">เรียงตามอักษร</option>
      <option value="price">เรียงตามราคา</option>
    </select>
  </div>
  
  <div class="grid-container" id="productGrid">
    </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div>
    <div style="font-size: 12px; color: #ccc;">เลือก <span id="cartCount">0</span> รายการ</div>
    <div style="font-size: 20px; font-weight: 700;"><span id="cartTotal">0</span>฿</div>
  </div>
  <button class="bb-btn" onclick="checkout()">สั่งซื้อสินค้า</button>
</div>

<div class="overlay" id="loadingOverlay">
  <div class="loader"></div>
</div>

<div class="overlay" id="adminOverlay">
  <div class="admin-modal">
    <span class="close-btn" onclick="closeAdmin()">×</span>
    <h2 style="margin-bottom: 15px; color: var(--primary);">จัดการสินค้า (Admin)</h2>
    
<div class="admin-form">
  <input type="hidden" id="a_id"> 
  <label style="font-size: 13px; color: #555;">เลือกโหมดจัดการ:</label>
  <select id="a_tab" onchange="toggleAdminFields()">
    <option value="แอพพรีเมี่ยม">สินค้า: แอพพรีเมี่ยม</option>
    <option value="เติมเกม">สินค้า: เติมเกม</option>
    <option value="IOS-ANDROID">สินค้า: IOS-ANDROID</option>
    <option value="STORE_INFO">⚙️ ตั้งค่าข้อมูลร้านค้า</option>
  </select>
  
 <div id="product-management-zone">
      <input type="text" id="a_name" placeholder="ชื่อแอป / ชื่อแพ็กเกจ (เช่น Netflix, 7วัน)">
      <input type="text" id="a_desc" placeholder="รายละเอียดย่อย / รายละเอียดแอป iOS">
      
      <div id="normal-fields">
        <input type="text" id="a_cat" placeholder="หมวดหลัก (เช่น แอพดูหนัง)">
        <input type="text" id="a_appDesc" placeholder="รายละเอียดใต้ชื่อแอป (เช่น ไม่เคลมปิด)">
        <input type="text" id="a_subCat" placeholder="กลุ่มตัวเลือกแพ็กเกจ (เช่น มือถือ/ไอแพด)">
      </div>

      <div id="ios-fields" style="display: none;">
        <label style="font-size: 13px; color: #555;">ระบบปฏิบัติการ:</label>
        <select id="a_os">
          <option value="iOS">iOS</option>
          <option value="Android">Android</option>
          <option value="iOS/Android">iOS/Android</option>
        </select>
      </div>

      <label style="font-size: 13px; color: #555;">สถานะสินค้า:</label>
      <select id="a_status">
        <option value="ready">พร้อมส่ง (สีเขียว)</option>
        <option value="notready">เมลไม่พร้อม / หมด (สีแดง)</option>
      </select>

      <input type="number" id="a_price" placeholder="ราคา (บาท)">
      <input type="text" id="a_icon" placeholder="ลิงก์รูปภาพแอป/ไอคอน (URL)">
  </div>

  <div id="store-management-zone" style="display: none;">
      <label style="font-size: 13px; color: #555;">สถานะร้านค้า (ป้ายมุมซ้ายบน):</label>
      <select id="store_status">
        <option value="open">เปิดร้าน (OPEN) - สีเขียว</option>
        <option value="closed">ปิดร้าน (CLOSED) - สีแดง</option>
        <option value="pause">พักส่ง (PAUSE) - สีส้ม</option>
        <option value="slow">ตอบช้า (SLOW) - สีเหลือง</option>
      </select>
      <input type="text" id="store_welcome" placeholder="ข้อความต้อนรับใต้ชื่อร้าน">
      <input type="text" id="store_line" placeholder="ไอดี Line (ใส่ @ ด้วย)">
      <input type="text" id="store_hours" placeholder="เวลาทำการ (เช่น 10:00 - 22:00)">
  </div>
  
<div style="display: flex; gap: 10px; margin-top: 15px;" id="admin-action-btns">
    <button class="admin-btn product-btn" style="background:#00d300;" onclick="submitAdminAction(event, 'add')">➕ เพิ่มใหม่</button>
    <button class="admin-btn product-btn" style="background:#ff9800;" onclick="submitAdminAction(event, 'edit_product')">💾 บันทึกแก้ไข</button>
    <button class="admin-btn product-btn" style="background:#ff3b3b;" onclick="submitAdminAction(event, 'delete_product')">🗑️ ลบ</button>
    <button class="admin-btn store-btn" style="background:#3B96F5; display:none;" onclick="submitStoreAction(event)">💾 บันทึกข้อมูลร้าน</button>
  </div>
  
  <p style="font-size: 11px; color: #777; margin-top: 10px;">* หากต้องการแก้ไข/ลบ ให้กดเลือกสินค้าจากหน้าเว็บในขณะที่เปิดโหมดแอดมิน ข้อมูลจะเด้งมาใส่ฟอร์มนี้อัตโนมัติ</p>

</div> 
</div> 
</div> 


<script>
// ==========================================
// การตั้งค่า & ข้อมูลพื้นฐาน
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbz2uKbrYR1HX4ofkMQ1Zt6fkBO4qvtEbZL6eZRPN2raaE2ZsJ49ZR9UrPmA7pomdjgJ/exec"; // ❌ เอา URL จาก App Script มาใส่ตรงนี้
let allProducts = [];
let cart = [];
let currentTab = "";
let storeInfo = {};
let tabsList = [];
let isAdmin = localStorage.getItem('isAdmin') === 'true';

// เช็คสถานะแอดมินตอนเปิดเว็บ
if(isAdmin) document.getElementById('admin-badge').style.display = 'flex';

// ==========================================
// 8. เอฟเฟกต์ Emoji พื้นหลัง
// ==========================================
const emojis = ['🎐','🍃','🌌'];
const container = document.getElementById('pts');
emojis.forEach(e => {
  for (let i = 0; i < 6; i++) {
    const el = document.createElement('div');
    el.className = 'pt'; el.textContent = e;
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (15 + Math.random() * 15) + 'px';
    el.style.animationDuration = (12 + Math.random() * 15) + 's';
    el.style.animationDelay = '-' + (Math.random() * 10) + 's';
    container.appendChild(el);
  }
});

// ==========================================
// 7. ดึงข้อมูลจาก API (ระบบกันแคช)
// ==========================================
async function loadData() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  try {
    const res = await fetch(API_URL + "?t=" + Date.now()); // Anti-cache
    const data = await res.json();
    
    allProducts = data.products || [];
    storeInfo = data.storeInfo || {};
    tabsList = data.tabs || [];
    
    // ตั้งค่าข้อมูลร้าน (เพิ่มระบบกดเพื่อ Logout แอดมิน)
    const welcomeEl = document.getElementById('welcomeText');
    if(storeInfo.welcome) welcomeEl.innerText = storeInfo.welcome;
    welcomeEl.onclick = adminLogout; // เชื่อมปุ่ม Logout
    
    updateShopStatus(storeInfo.status || 'open');
    
    renderTabs();
    if(tabsList.length > 0) {
      switchTab(tabsList[0]);
    }
  } catch (err) {
    console.error("Error loading data:", err);
    document.getElementById('productGrid').innerHTML = "<p style='text-align:center;width:100%;'>ไม่สามารถโหลดข้อมูลได้ โปรดรีเฟรช</p>";
  }
  document.getElementById('loadingOverlay').style.display = 'none';
}

function updateShopStatus(status) {
  const pill = document.getElementById('shopStatusPill');
  const text = document.getElementById('shopStatusText');
  pill.className = `shop-status status-${status}`;
  text.innerText = status.toUpperCase();
}

// ==========================================
// 2. ระบบแท็บ
// ==========================================
function renderTabs() {
  const tc = document.getElementById('tabContainer');
  tc.innerHTML = tabsList.map(t => 
    `<button class="tab-btn" onclick="switchTab('${t}')" id="tab-${t.replace(/\s+/g, '-')}">${t}</button>`
  ).join('');
  tc.innerHTML += `<button class="tab-btn" onclick="switchTab('info')" id="tab-info">ติดต่อเรา</button>`;
}

function switchTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  
  const activeId = tabName === 'info' ? 'tab-info' : `tab-${tabName.replace(/\s+/g, '-')}`;
  const activeBtn = document.getElementById(activeId);
  if(activeBtn) activeBtn.classList.add('active');
  
  document.getElementById('currentTabTitle').innerText = tabName === 'info' ? 'ข้อมูลร้านค้า' : 'รายการสินค้า';
  
  if(tabName === 'info') {
    renderInfoPage();
  } else {
    renderProducts();
  }
}

// ==========================================
// 3. ระบบแสดงการ์ดสินค้า & เลือกสินค้า
// ==========================================
function renderProducts() {
  const grid = document.getElementById('productGrid');
  const sortType = document.getElementById('sortSelect').value;
  
  let products = allProducts.filter(p => p.tab === currentTab);
  
  // เรียงข้อมูล
  if (sortType === 'name') products.sort((a,b) => a.name.localeCompare(b.name));
  if (sortType === 'price') products.sort((a,b) => a.price - b.price);

  grid.innerHTML = products.map(p => {
    const isSelected = cart.find(item => item.id === p.id);
    const statusClass = p.status === 'ready' ? 'status-ready' : 'status-notready';
    const statusText = p.status === 'ready' ? 'พร้อมส่ง' : 'เมลไม่พร้อม';
    
    const imgHtml = p.icon ? `<img src="${p.icon}" class="card-icon" alt="${p.name}">` : '';

    return `
      <div class="item-card ${isSelected ? 'selected' : ''}" onclick="toggleItem('${p.id}')">
        <div class="check-circle"></div>
        <div class="app-status ${statusClass}">${statusText}</div>
        ${imgHtml}
        <div class="card-title">${p.name}</div>
        <div class="card-desc">${p.desc || p.subCat || p.os || ''}</div>
        <div class="card-price">${p.price}฿</div>
      </div>
    `;
  }).join('');
}

function renderInfoPage() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = `
    <div style="background:var(--bg-card); color:#000; padding:20px; border-radius:16px; grid-column: 1 / -1;">
      <h3 style="margin-bottom:10px; color:var(--primary);">ช่องทางการติดต่อ</h3>
      <p><b>Line:</b> ${storeInfo.line || '-'}</p>
      <p><b>เวลาทำการ:</b> ${storeInfo.hours || '-'}</p>
    </div>
  `;
}

// ==========================================
// 4 & 13. ระบบตะกร้า & คำนวณโปรโมชัน
// ==========================================
function updateBottomBar() {
  const bar = document.getElementById('bottomBar');
  if (cart.length > 0) {
    bar.classList.add('active');
    document.getElementById('cartCount').innerText = cart.length;
    document.getElementById('cartTotal').innerText = calculateTotal();
  } else {
    bar.classList.remove('active');
  }
}

function calculateTotal() {
  let total = 0;
  
  const iosItems = cart.filter(p => p.tab === "แอพ-เกม iOS/Android" || p.tab === "IOS-ANDROID");
  const otherItems = cart.filter(p => p.tab !== "แอพ-เกม iOS/Android" && p.tab !== "IOS-ANDROID");

  otherItems.forEach(p => total += Number(p.price));

  let promoCount = 0;
  let nonPromoTotal = 0;

  iosItems.forEach(p => {
    let price = Number(p.price);
    if (price >= 20 && price <= 25) {
      promoCount++;
    } else {
      nonPromoTotal += price;
    }
  });

  let promoTotal = 0;
  if (promoCount >= 30) { promoTotal = 360 + ((promoCount - 30) * 20); }
  else if (promoCount >= 15) { promoTotal = 210 + ((promoCount - 15) * 20); }
  else if (promoCount >= 8) { promoTotal = 80 + ((promoCount - 8) * 20); }
  else if (promoCount >= 3) { promoTotal = 45 + ((promoCount - 3) * 20); }
  else if (promoCount === 2 && iosItems.some(i=>Number(i.price)===25)) { promoTotal = 45; }
  else {
    iosItems.filter(p => Number(p.price) >= 20 && Number(p.price) <= 25).forEach(p => promoTotal += Number(p.price));
  }

  return total + promoTotal + nonPromoTotal;
}

// ==========================================
// 14. ระบบสรุปยอด Checkout
// ==========================================
function checkout() {
  if(cart.length === 0) return;
  
  let text = "";
  let total = calculateTotal();
  const mainTab = cart[0].tab;

  if (mainTab === "แอพ-เกม iOS/Android" || mainTab === "IOS-ANDROID") {
    text = `🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n✿  𓈒  รวมยอด    ꒰  ${total}฿  ꒱  ݂🎐\n`;
    cart.forEach(item => { text += `♡ 🍃 ݂  ${item.name} [${item.os || 'iOS'}] 𓈒\n`; });
    text += `---------------------------\nรบกวนรอแม่ค้าเช็คเมล-ยอดและส่งเลขบัญชีให้ทีครับ/ค่ะ 🙏`;
  } else if (mainTab === "เติมเกม") {
    text = `🛒 *รายการสั่งซื้อ (Wanderer Shop)*\n---------------------------\n`;
    cart.forEach((item, index) => {
      text += `${index + 1}. ${item.name}\n    แพ็กเกจ: ${item.desc || item.subCat}\n    ราคา: ${item.price} บาท\n`;
    });
    text += `---------------------------\n*ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\n*แจ้งไอดี ได้เลยค่ะ*`;
  } else {
    text = `🛒 รายการสั่งซื้อ (Wanderer Shop)\n---------------------------\n`;
    cart.forEach((item, index) => {
      text += `${index + 1}. ${item.name}\n    แพ็กเกจ: ${item.desc || item.subCat}\n    ราคา: ${item.price} บาท\n`;
    });
    text += `---------------------------\n*ยอดรวมทั้งสิ้น: ${total} บาท*\n---------------------------\nรบกวนรอแอดมินตอบก่อนค่อยโอนนะคะ`;
  }

  navigator.clipboard.writeText(text).then(() => {
    alert("คัดลอกรายการสั่งซื้อแล้ว กำลังพาไปที่ LINE...");
    window.location.href = `https://line.me/R/ti/p/${storeInfo.line || '@YOUR_LINE_ID'}`;
  }).catch(err => {
    alert("ไม่สามารถคัดลอกได้: " + text);
  });
}

// ==========================================
// 6. ระบบแอดมินลับ & ออกจากระบบแอดมิน
// ==========================================
let clickCount = 0; let clickTimer;

function adminLoginClick() {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
  
  if (clickCount >= 5) {
    clickCount = 0;
    if (!isAdmin) {
      const pwd = prompt("ระบุรหัสผ่าน Admin:");
      if (pwd === "170647") { 
        isAdmin = true;
        localStorage.setItem('isAdmin', 'true');
        document.getElementById('admin-badge').style.display = 'flex';
        alert("เข้าสู่โหมดแอดมิน (สามารถกดที่ 'ข้อความต้อนรับ' เพื่อออกจากระบบได้)");
      } else { alert("รหัสผ่านไม่ถูกต้อง"); }
    } else {
      openAdmin();
    }
  }
}

function adminLogout() {
  if (isAdmin) {
    const confirmLogout = confirm("ต้องการออกจากโหมดแอดมินใช่หรือไม่?");
    if (confirmLogout) {
      isAdmin = false;
      localStorage.removeItem('isAdmin');
      document.getElementById('admin-badge').style.display = 'none';
      alert("ออกจากโหมดแอดมินแล้ว (สลับมาเป็นมุมมองลูกค้า)");
    }
  }
}

// ==========================================
// ฟังก์ชันจัดการ Admin Panel
// ==========================================
function openAdmin() {
  document.getElementById('adminOverlay').style.display = 'flex';
  clearAdminForm();
  toggleAdminFields();
}

function closeAdmin() {
  document.getElementById('adminOverlay').style.display = 'none';
}

function toggleAdminFields() {
  const tab = document.getElementById('a_tab').value;
  
  if (tab === "STORE_INFO") {
    document.getElementById('product-management-zone').style.display = 'none';
    document.getElementById('store-management-zone').style.display = 'block';
    
    document.getElementById('store_status').value = storeInfo.status || 'open';
    document.getElementById('store_welcome').value = storeInfo.welcome || '';
    document.getElementById('store_line').value = storeInfo.line || '';
    document.getElementById('store_hours').value = storeInfo.hours || '';
    
    document.querySelectorAll('.product-btn').forEach(b => b.style.display = 'none');
    document.querySelector('.store-btn').style.display = 'block';
  } else {
    document.getElementById('product-management-zone').style.display = 'block';
    document.getElementById('store-management-zone').style.display = 'none';
    
    document.querySelectorAll('.product-btn').forEach(b => b.style.display = 'block');
    document.querySelector('.store-btn').style.display = 'none';
    
    if (tab === "IOS-ANDROID" || tab === "แอพ-เกม iOS/Android") {
      document.getElementById('normal-fields').style.display = 'none';
      document.getElementById('ios-fields').style.display = 'block';
    } else {
      document.getElementById('normal-fields').style.display = 'block';
      document.getElementById('ios-fields').style.display = 'none';
    }
  }
}

async function submitStoreAction(event) {
  const btn = event.currentTarget;
  const originalText = btn.innerText;
  btn.innerText = "⏳ กำลังโหลด...";
  
  const payload = {
    action: "save_store",
    status: document.getElementById('store_status').value,
    welcome: document.getElementById('store_welcome').value,
    line: document.getElementById('store_line').value,
    hours: document.getElementById('store_hours').value
  };

  try {
    const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const result = await response.json();
    if(result.success) {
      alert("✅ บันทึกข้อมูลร้านค้าสำเร็จ!");
      closeAdmin();
      loadData(); 
    } else { alert("❌ เกิดข้อผิดพลาด"); }
  } catch (err) { alert("❌ ไม่สามารถติดต่อเซิร์ฟเวอร์ได้"); }
  btn.innerText = originalText;
}

function clearAdminForm() {
  document.getElementById('a_id').value = "";
  document.getElementById('a_name').value = "";
  document.getElementById('a_desc').value = "";
  document.getElementById('a_cat').value = "";
  if(document.getElementById('a_appDesc')) document.getElementById('a_appDesc').value = "";
  document.getElementById('a_subCat').value = "";
  document.getElementById('a_price').value = "";
  document.getElementById('a_icon').value = "";
}

function toggleItem(id) {
  const product = allProducts.find(p => p.id === id);
  if(!product) return;

  if (isAdmin) {
    document.getElementById('adminOverlay').style.display = 'flex';
    document.getElementById('a_id').value = product.id;
    document.getElementById('a_tab').value = product.tab === "แอพ-เกม iOS/Android" ? "IOS-ANDROID" : product.tab;
    toggleAdminFields();
    
    document.getElementById('a_name').value = product.name || "";
    document.getElementById('a_desc').value = product.desc || "";
    document.getElementById('a_price').value = product.price || 0;
    document.getElementById('a_icon').value = product.icon || "";
    document.getElementById('a_status').value = product.status || "ready";

    if (product.tab === "แอพ-เกม iOS/Android" || product.tab === "IOS-ANDROID") {
      document.getElementById('a_os').value = product.os || "iOS";
    } else {
      document.getElementById('a_cat').value = product.cat || "";
      document.getElementById('a_subCat').value = product.subCat || "";
      if(document.getElementById('a_appDesc')) document.getElementById('a_appDesc').value = product.appDesc || "";
    }
    return;
  }

  const index = cart.findIndex(item => item.id === id);
  if (index > -1) { cart.splice(index, 1); } 
  else { cart.push(product); }
  
  renderProducts(); 
  updateBottomBar();
}

async function submitAdminAction(event, actionType) {
  const btn = event.currentTarget;
  const originalText = btn.innerText;
  btn.innerText = "⏳ กำลังโหลด...";
  
  const payload = {
    action: actionType,
    id: document.getElementById('a_id').value,
    tab: document.getElementById('a_tab').value,
    name: document.getElementById('a_name').value,
    desc: document.getElementById('a_desc').value,
    price: Number(document.getElementById('a_price').value) || 0,
    icon: document.getElementById('a_icon').value,
    status: document.getElementById('a_status').value,
    os: document.getElementById('a_os').value,
    cat: document.getElementById('a_cat').value,
    subCat: document.getElementById('a_subCat').value,
    appDesc: document.getElementById('a_appDesc') ? document.getElementById('a_appDesc').value : ""
  };

  if (actionType !== 'add' && !payload.id) {
    alert("กรุณาเลือกสินค้าที่ต้องการแก้ไข/ลบ ก่อนครับ!");
    btn.innerText = originalText;
    return;
  }

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const result = await response.json();
    
    if(result.success) {
      alert("✅ ดำเนินการสำเร็จ!");
      closeAdmin();
      loadData(); 
    } else {
      alert("❌ เกิดข้อผิดพลาด: " + (result.error || "ไม่ทราบสาเหตุ"));
    }
  } catch (err) {
    alert("❌ ไม่สามารถติดต่อเซิร์ฟเวอร์ได้");
  }
  btn.innerText = originalText;
}

// เริ่มการทำงาน
window.onload = loadData;

</script>
